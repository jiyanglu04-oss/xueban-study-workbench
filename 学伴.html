/* ==================== 工具 ==================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
function parseD(s) {
  if (!s) return null;
  const d = new Date(String(s).replace(' ', 'T'));
  return isNaN(d.getTime()) ? null : d;
}
function uid(p) { return (p || 'id') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function weekdayOf(d) { const w = d.getDay(); return w === 0 ? 7 : w; }
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function daysBetween(a, b) {
  const A = new Date(a); A.setHours(0, 0, 0, 0);
  const B = new Date(b); B.setHours(0, 0, 0, 0);
  return Math.round((B - A) / 86400000);
}
function fmtDue(s) {
  const d = parseD(s); if (!d) return '无截止';
  const diff = d - new Date();
  const dd = daysBetween(new Date(), d);
  const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (diff < 0) return dd === 0 ? '已逾期 · ' + hm : '已逾期 ' + Math.abs(dd) + ' 天';
  if (dd === 0) return '今天 ' + hm;
  if (dd === 1) return '明天 ' + hm;
  if (dd === 2) return '后天 ' + hm;
  if (dd < 7) return dd + ' 天后 ' + hm;
  return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 ' + hm;
}
function dueClass(s) {
  const d = parseD(s); if (!d) return 'ok';
  const diff = d - new Date();
  if (diff < 0) return 'over';
  if (diff < 86400000 * 2) return 'soon';
  return 'ok';
}
function relTime(s) {
  const d = parseD(s); if (!d) return '';
  const diff = (Date.now() - d) / 1000;
  if (diff < 0) return '刚刚';
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  const dd = daysBetween(d, new Date());
  if (dd === 0) return '今天';
  if (dd === 1) return '昨天';
  if (dd < 7) return dd + ' 天前';
  return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
}
function fmtWhen(s) {
  const d = parseD(s); if (!d) return '';
  const dd = daysBetween(new Date(), d);
  const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (dd === 0) return '今天 ' + hm;
  if (dd === -1) return '昨天 ' + hm;
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
}

/* 周次解析：支持 "1-18" / "1-8,10-16" / "1-18单" / "1-18双" */
function parseWeeks(spec) {
  if (spec == null || spec === '' || spec === 'all') return null;
  let s = String(spec);
  let parity = 0;
  if (/单/.test(s)) parity = 1;
  if (/双/.test(s)) parity = 2;
  s = s.replace(/[单双周\s]/g, '');
  if (!s) return null;
  const set = new Set();
  s.split(/[,，、;；]/).forEach(part => {
    part = part.trim(); if (!part) return;
    const m = part.match(/^(\d+)\s*[-~至到]\s*(\d+)$/);
    if (m) {
      const a = +m[1], b = +m[2];
      for (let i = Math.min(a, b); i <= Math.max(a, b); i++) set.add(i);
    } else if (/^\d+$/.test(part)) set.add(+part);
  });
  if (parity === 1) Array.from(set).forEach(w => { if (w % 2 === 0) set.delete(w); });
  if (parity === 2) Array.from(set).forEach(w => { if (w % 2 === 1) set.delete(w); });
  return set;
}
function inWeek(spec, w) {
  const set = parseWeeks(spec);
  return set === null || set.has(+w);
}
function hexA(hex, a) {
  const h = String(hex || '#8B6F47').replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function hashStr(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

async function apiRequest(path, options) {
  if (!API.enabled) throw new Error('当前以单文件模式运行');
  const opts = Object.assign({ headers: {} }, options || {});
  if (opts.body && !opts.headers['Content-Type']) opts.headers['Content-Type'] = 'application/json';
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) { }
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data || {};
}

async function loadServerState() {
  if (!API.enabled) return null;
  try {
    const data = await apiRequest('/api/state');
    API.connected = true;
    API.error = '';
    API.revision = data.revision || '';
    return data.state || null;
  } catch (e) {
    API.connected = false;
    API.error = e.message || '连接失败';
    return null;
  }
}

function queueServerSave() {
  if (!API.enabled || !API.connected) return;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => pushServerState(false), 450);
}

async function pushServerState(showResult) {
  if (!API.enabled || !API.connected || API.saving) return false;
  API.saving = true;
  try {
    const data = await apiRequest('/api/state', { method: 'PUT', body: JSON.stringify({ state: S }) });
    API.revision = data.revision || API.revision;
    API.lastSaved = new Date().toISOString();
    API.error = '';
    if (showResult) toast('已保存到本机数据库', 'ok');
    return true;
  } catch (e) {
    API.connected = false;
    API.error = e.message || '保存失败';
    if (showResult) toast('数据库保存失败，已继续保存在浏览器中', 'warn');
    return false;
  } finally {
    API.saving = false;
  }
}

/* ==================== 同步数据合并 ==================== */
function mergePayload(payload, silent) {
  const n = { courses: 0, msgs: 0, todos: 0 };
  if (!payload) return n;
  const dismissed = S.settings.dismissed || [];

  (payload.courses || []).forEach(c => {
    const key = c.syncKey || c.id || c.name;
    const ex = S.courses.find(x => (x.syncKey || x.id) === key || x.name === c.name);
    if (ex) {
      ['teacher', 'school', 'url', 'platform', 'sessions', 'room', 'detail'].forEach(k => { if (c[k] != null && c[k] !== '') ex[k] = c[k]; });
      normCourse(ex);
    } else {
      const nc = normCourse(Object.assign({
        id: uid('c'),
        color: PALETTE[S.courses.length % PALETTE.length],
        syncKey: key
      }, c));
      S.courses.push(nc);
      n.courses++;
    }
  });

  (payload.messages || []).forEach(m => {
    const id = m.id || ('s-' + hashStr((m.platform || '') + (m.title || '') + (m.time || '')));
    if (dismissed.indexOf(id) >= 0) return;
    const ex = S.messages.find(x => x.id === id);
    if (ex) {
      Object.assign(ex, {
        title: m.title || ex.title,
        content: m.content || ex.content,
        url: m.url || ex.url,
        time: m.time || ex.time,
        deadline: m.deadline || ex.deadline
      });
    } else {
      // 不强制 read:false —— 同步脚本会把「很旧的历史通知」直接标成已读
      // （翻历史页一次会带回上百条旧通知），这里要尊重它，否则未读角标会被淹没。
      S.messages.push(normMsg(Object.assign({}, m, { id: id })));
      n.msgs++;
    }
  });

  (payload.todos || []).forEach(t => {
    const id = t.id || ('t-' + hashStr((t.title || '') + (t.due || '')));
    if (dismissed.indexOf(id) >= 0) return;
    const ex = S.todos.find(x => x.id === id);
    if (ex) { Object.assign(ex, { due: t.due || ex.due, title: t.title || ex.title }); }
    else { S.todos.push(normTodo(Object.assign({}, t, { id: id }))); n.todos++; }
  });

  S.meta.lastSync = payload.syncedAt || new Date().toISOString();
  S.meta.syncNote = payload.note || '';
  // connections 里带着「登录态还剩几天」，loginHealth 是体检摘要。
  // 这两个只有同步脚本算得出来（要读浏览器的 cookie 到期时间），页面照单全收。
  if (Array.isArray(payload.connections) && payload.connections.length) {
    S.meta.connections = payload.connections;
  }
  if (payload.loginHealth) S.meta.loginHealth = payload.loginHealth;
  if (!silent) save();
  return n;
}

/* 记住「这条我删了」，否则下次同步会把它原样塞回来 */
function dismissId(id) {
  if (!id) return;
  if (!Array.isArray(S.settings.dismissed)) S.settings.dismissed = [];
  if (S.settings.dismissed.indexOf(id) >= 0) return;
  S.settings.dismissed.push(id);
  if (S.settings.dismissed.length > 400) {
    S.settings.dismissed = S.settings.dismissed.slice(-400);
  }
}

function dismissMany(ids) {

let modalStack = [];
function openModal(title, bodyHTML, footHTML, opts) {
  opts = opts || {};
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML =
    '<div class="modal' + (opts.wide ? ' wide' : '') + '">' +
      '<div class="modal-h"><h3>' + esc(title) + '</h3>' +
        '<button class="icon-btn" data-close="1" title="关闭">' + ic('x') + '</button></div>' +
      '<div class="modal-b"></div>' +
      (footHTML ? '<div class="modal-f">' + footHTML + '</div>' : '') +
    '</div>';
  $('.modal-b', mask).innerHTML = bodyHTML;
  mask.addEventListener('mousedown', e => { if (e.target === mask) closeModal(); });
  $('[data-close]', mask).addEventListener('click', closeModal);
  document.body.appendChild(mask);
  modalStack.push(mask);
  const first = mask.querySelector('input,select,textarea');
  if (first) setTimeout(() => first.focus(), 70);
  return mask;
}
function closeModal() { const m = modalStack.pop(); if (m) m.remove(); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalStack.length) closeModal();
});
function confirmBox(title, text, onOk, okLabel) {
  const m = openModal(title,
    '<p style="margin:0;font-size:13.5px;color:var(--text-2);line-height:1.7">' + text + '</p>',
    '<button class="btn" data-no>取消</button><button class="btn btn-danger" data-yes>' + esc(okLabel || '确认') + '</button>');
  $('[data-no]', m).onclick = closeModal;
  $('[data-yes]', m).onclick = () => { closeModal(); onOk(); };
}

/* ==================== 计算 ==================== */
function weekOf(date) {
  const st = parseD(S.settings.termStart + 'T00:00:00');
  if (!st) return 1;
  return Math.floor(daysBetween(st, date) / 7) + 1;
}
function dateOf(week, weekday) {
  const st = parseD(S.settings.termStart + 'T00:00:00');
  if (!st) return null;
  const d = new Date(st);
  d.setDate(d.getDate() + (week - 1) * 7 + (weekday - 1));
  return d;
}
function sessionsOn(week, weekday) {
  const out = [];
  (S.courses || []).forEach(c => (c.sessions || []).forEach(s => {
    if (+s.day === +weekday && inWeek(s.weeks, week)) out.push({ c: c, s: s });
  }));
  return out.sort((a, b) => a.s.start - b.s.start);
}
function sections() { return S.settings.sections || DEFAULT_SECTIONS; }
function secTime(i) {
  const sec = sections()[i - 1];
  return sec ? { start: sec[0], end: sec[1] } : { start: '--:--', end: '--:--' };
}
function openTodos() { return S.todos.filter(t => !t.done); }
function overdueTodos() {
  const now = new Date();
  return openTodos().filter(t => { const d = parseD(t.due); return d && d < now; });
}
function unreadMsgs() { return S.messages.filter(m => !m.read); }
function courseOf(idOrName) { return S.courses.find(x => x.id === idOrName || x.name === idOrName); }

/* 「本学期在上的课」= 自己录进来的课（课表导入 / 手动新增），或至少排了课时段的课。
   平台同步回来的课程（带 syncKey）绝大多数是课程池里的历史课 / 全部学期，
   25 门里可能只有几门是当下要上的 —— 它们默认不进课程管理界面，按需切换到「全部」再看。
   注意：这里的判据必须和 mergePayload() 对齐 —— 课表课只在按名字撞车时被更新字段，
   不会被写入 syncKey，所以「无 syncKey」是稳定可靠的标志。 */
function myCourses() {
  return S.courses.filter(c => !c.syncKey || (c.sessions || []).length);
}
function isMyCourse(c) { return !c.syncKey || (c.sessions || []).length; }
/* 下拉选项用：本学期课程，外加「当前已关联的那一门」——
   避免编辑历史待办时，它关联的课不在列表里，一保存就把关联弄丢了。 */
function courseOptionsFor(cur) {
  const list = myCourses().slice();
  [cur && cur.courseId, cur && cur.course].forEach(k => {
    if (!k) return;
    const c = S.courses.find(x => x.id === k || x.name === k);
    if (c && list.indexOf(c) < 0) list.push(c);
  });
  return list;
}

/* 登录态提醒。
   定时同步是无人值守的：无窗口模式不会弹扫码窗，只会跳过那个平台然后正常退出。
   如果不在这里显式提示，用户的感受就是「数据怎么莫名其妙不更新了」——
   而平台入口页原来把它和「待连接」画成同一个样子，等于没提示。

   分三档，因为紧急程度差很多：
     expired / needs_login —— 已经抓不到数据了，必须处理
     expiring              —— 还剩几天，趁早扫码就好
     unknown               —— 一条凭证都没有，多半是被浏览器清掉了
   登录 cookie 的到期时间是服务端写死的（实测反复同步并不会续期），所以
   「还剩几天」是个可预测的数字 —— 提前说出来，用户才有机会从容处理。 */
function loginAlerts() {
  const out = { expired: [], expiring: [], unknown: [] };
  (S.meta.connections || []).forEach(x => {
    if (!x || !x.key) return;
    const p = PLATFORMS.find(y => y.key === x.key);
    const name = p ? p.name : (x.key || '未知平台');
    const st = x.loginStatus;
    if (x.status === 'needs_login' || st === 'expired') out.expired.push(name);
    else if (st === 'expiring') out.expiring.push(name + '（还剩 ' + x.daysLeft + ' 天）');
    else if (st === 'unknown') out.unknown.push(name);
  });
  return out;
}

function loginBannerItem(badge, icon, title, text, bg, border) {
  return '<div class="demo-banner mb" style="background:' + bg + ';border-color:' + border + '">' +
    '<div class="card-b" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
    '<span class="badge ' + badge + '">' + ic(icon) + esc(title) + '</span>' +
    '<span style="font-size:13px;color:var(--text-2);flex:1;min-width:220px">' + text + '</span>' +
    '<button class="btn btn-sm" data-go="plat">去平台入口</button>' +
    '</div></div>';
}

function loginBanner() {
  const a = loginAlerts();
  let html = '';
  if (a.expired.length) {
    html += loginBannerItem('b-p2', 'warn', '登录已过期',
      esc(a.expired.join('、')) + ' 的登录态失效了，每天两次的自动同步会跳过它。' +
      '双击工作台文件夹里的「重新登录.bat」，扫码一次就能恢复。',
      'var(--orange-w)', 'var(--orange)');
  }
  if (a.unknown.length) {
    html += loginBannerItem('b-p2', 'warn', '找不到登录凭证',
      esc(a.unknown.join('、')) + ' 还没有可用的登录态。' +
      '双击工作台文件夹里的「重新登录.bat」走一次扫码即可。',
      'var(--orange-w)', 'var(--orange)');
  }
  if (a.expiring.length) {
    html += loginBannerItem('b-warn', 'clock', '登录态快到期',
      esc(a.expiring.join('、')) + '。到期后自动同步会自动跳过它 —— ' +
      '双击工作台文件夹里的「重新登录.bat」提前续期，比掉线后再补救省事。',
      '#F8F0D8', 'var(--gold-d)');
  }
  return html;
}

function todayList(list, w, wd) {
  if (!list.length) return emptyHTML('spark', '今天没有排课，自由安排');
  const now = new Date();
  return '<div class="tl">' + list.map(x => {
    const t = secTime(x.s.start);
    const e = secTime(x.s.start + x.s.len - 1).end;
    const sh = t.start.split(':').map(Number);
    const eh = e.split(':').map(Number);
    const st = new Date(); st.setHours(sh[0], sh[1], 0, 0);
    const en = new Date(); en.setHours(eh[0], eh[1], 0, 0);
    const isNow = now >= st && now <= en;
    const isDone = now > en;
    return '<div class="tl-item' + (isNow ? ' now' : '') + (isDone ? ' done' : '') + '">' +
      '<div class="tl-time"><b>' + t.start + '</b><span>' + e + '</span></div>' +
      '<div class="tl-bar" style="background:' + x.c.color + '"></div>' +
      '<div class="tl-body"><b>' + esc(x.c.name) + '</b>' +
      '<span>' + esc(x.s.room || x.c.teacher || '') +
      (x.c.teacher && x.s.room ? ' · ' + esc(x.c.teacher) : '') +
      ' · 第 ' + x.s.start + '-' + (x.s.start + x.s.len - 1) + ' 节' +
      (isNow ? ' · <b style="color:var(--green)">正在上课</b>' : '') + '</span></div>' +
      '</div>';
  }).join('') + '</div>';
}

function weekHours() {
  const w = UI.week == null ? weekOf(new Date()) : UI.week;
  let n = 0;
  for (let d = 1; d <= 7; d++) sessionsOn(w, d).forEach(x => n += x.s.len);
  return Math.round(n * 0.75 * 10) / 10;
}

function weekendBusy(w) {
  // 有调课落在周末时，周末两列必须露出来，否则那一周会显得「没这门课」。
  for (let d = 6; d <= 7; d++) if (sessionsOn(w, d).length) return true;
  return false;
}

function renderTT() {
  const now = new Date();
  const curW = Math.max(1, Math.min(S.settings.totalWeeks, weekOf(now)));
  const w = UI.week == null ? curW : Math.max(1, Math.min(S.settings.totalWeeks, UI.week));
  const forcedWeekend = weekendBusy(w);
  const days = (S.settings.showWeekend || forcedWeekend) ? 7 : 5;
  const rows = sections().length;
  UI.week = w;
  // 「在修课程」只算真的排了课的——平台同步过来的课程没有课表时段，
  // 全算进去会把这门数撑到三十几，看着像坏了。
  const withSess = S.courses.filter(c => (c.sessions || []).length).length;

  let html = '<div class="card"><div class="card-h" style="flex-wrap:wrap">' +
    '<h3>' + ic('cal') + ' 第 ' + w + ' 周' + (w === curW ? ' <span class="badge b-ok" style="height:18px">本周</span>' : '') +
      (forcedWeekend && !S.settings.showWeekend
        ? ' <span class="badge b-info" style="height:18px">本周含周末课</span>' : '') + '</h3>' +
    '<div class="sp">' +
      '<button class="btn btn-sm" id="ttImport">' + ic('upload') + '导入课表图片</button>' +
      '<div class="seg"><button data-wk="-1">‹ 上周</button><button data-wk="0">本周</button><button data-wk="1">下周 ›</button></div>' +
      '<span class="pill" style="height:31px;font-size:12px">' +
        (dateOf(w, 1) ? (dateOf(w, 1).getMonth() + 1) + '/' + dateOf(w, 1).getDate() : '') + ' — ' +
        (dateOf(w, days) ? (dateOf(w, days).getMonth() + 1) + '/' + dateOf(w, days).getDate() : '') + '</span>' +
      '<label class="switch' + (days === 7 ? ' on' : '') + '" id="swWeekend" style="padding:0;gap:7px">' +
        '<span class="sw" style="transform:scale(.84)"></span>' +
        '<span class="tx" style="font-size:12.5px;font-weight:600">周末</span></label>' +
    '</div></div>';

  html += '<div class="card-b"><div class="tt-wrap"><div class="tt" id="ttGrid" ' +
    'style="grid-template-columns:58px repeat(' + days + ',minmax(0,1fr));grid-auto-rows:46px">';

  html += '<div style="grid-row:1;grid-column:1"></div>';
  for (let d = 1; d <= days; d++) {
    const dt = dateOf(w, d);
    const isToday = dt && ymd(dt) === ymd(now);
    html += '<div class="tt-hd' + (isToday ? ' today' : '') + '" style="grid-row:1;grid-column:' + (d + 1) + '">星期' + WD[d - 1] +
      '<span>' + (dt ? (dt.getMonth() + 1) + '/' + dt.getDate() : '') + '</span></div>';
  }
  for (let r = 1; r <= rows; r++) {
    const t = secTime(r);
    html += '<div class="tt-tcol" style="grid-row:' + (r + 1) + ';grid-column:1"><b>' + r + '</b>' + t.start + '<br>' + t.end + '</div>';
    for (let d = 1; d <= days; d++) {
      html += '<div class="tt-cell" data-cell="' + d + '-' + r + '" style="grid-row:' + (r + 1) + ';grid-column:' + (d + 1) + '"></div>';
    }
  }
  for (let d = 1; d <= days; d++) {
    sessionsOn(w, d).forEach(x => {
      const c = x.c, s = x.s;
      html += '<div class="tt-ev" data-cid="' + c.id + '" title="' + esc(c.name + (c.teacher ? ' · ' + c.teacher : '') + (s.room ? ' · ' + s.room : '')) + '" ' +
        'style="grid-row:' + (s.start + 1) + ';grid-column:' + (d + 1) + ';grid-row-end:span ' + Math.max(1, s.len) +
        ';background:' + hexA(c.color, 0.14) + ';border-left-color:' + c.color + ';z-index:3">' +
        '<b style="color:' + c.color + '">' + esc(c.name) + '</b>' +
        (s.room ? '<span style="color:' + c.color + '">' + esc(s.room) + '</span>' : '') +
        (c.teacher ? '<span style="color:' + c.color + '">' + esc(c.teacher) + '</span>' : '') +
        '</div>';
    });
  }
  html += '</div></div>';

  // 图例只列「这一周真的会上」的课；否则平台同步来的一堆没排课的课程会把图例刷爆。
  const weekCourses = [];
  for (let d = 1; d <= days; d++) {
    sessionsOn(w, d).forEach(x => { if (!weekCourses.some(o => o.id === x.c.id)) weekCourses.push(x.c); });
  }
  if (weekCourses.length) {
    html += '<div class="tt-legend">' + weekCourses.map(c =>
      '<span class="tt-lg" data-cid="' + c.id + '"><i style="background:' + c.color + '"></i>' + esc(c.name) + '</span>').join('') + '</div>';
  }
  html += '</div></div>';

  html += '<div class="grid g-3 mt">' +
    '<div class="card"><div class="card-b" style="display:flex;gap:12px;align-items:center">' +
      '<div class="kpi-ic" style="background:#ECE0CC;color:#8B6F47">' + ic('book') + '</div>' +
      '<div><div class="kpi-v">' + withSess + '</div><div class="kpi-k">在修课程</div></div></div></div>' +
    '<div class="card"><div class="card-b" style="display:flex;gap:12px;align-items:center">' +
      '<div class="kpi-ic" style="background:#E5EBD9;color:#5F7A4A">' + ic('clock') + '</div>' +
      '<div><div class="kpi-v">' + weekHours() + '<span style="font-size:14px;font-weight:600"> h</span></div><div class="kpi-k">本周课时</div></div></div></div>' +
    '<div class="card"><div class="card-b" style="display:flex;gap:12px;align-items:center">' +
      '<div class="kpi-ic" style="background:#F7E8D1;color:#B8762B">' + ic('warn') + '</div>' +
      '<div><div class="kpi-v">' + Math.max(0, S.settings.totalWeeks - 18) + '<span style="font-size:14px;font-weight:600"> 周</span></div><div class="kpi-k">考试周</div></div></div></div>' +
    '</div>' +
    '<div class="hint mt">点空白格子可以快速加课；点课程块可以查看详情、进入对应平台。周次支持「1-18」「1-16单」「2-16双」等写法。</div>';

  $('#view').innerHTML = html;
  $('#ttImport').onclick = openTimetableImport;

  $$('[data-wk]').forEach(b => b.onclick = () => {
    const v = +b.dataset.wk;
    UI.week = v === 0 ? curW : w + v;
    UI.week = Math.max(1, Math.min(S.settings.totalWeeks, UI.week));
    renderTT();
  });
  const swv = $('#swWeekend');
  if (swv) swv.onclick = () => { S.settings.showWeekend = !S.settings.showWeekend; save(); renderTT(); };
  $$('#ttGrid .tt-cell').forEach(cell => cell.onclick = () => {
    const parts = cell.dataset.cell.split('-');
    editCourse(null, { day: +parts[0], start: +parts[1], len: 2, weeks: '1-' + (S.settings.totalWeeks - 2), room: '' }, w);
  });
  $$('#ttGrid .tt-ev, .tt-lg').forEach(e => e.onclick = ev => { ev.stopPropagation(); openCourse(e.dataset.cid); });
}

      '<div class="row-meta">' +

      '</div></div>' +
    '<span class="badge ' + pcls + '">' + pl + '</span>' +

      '<button class="icon-btn" data-edit-todo="' + t.id + '" title="编辑" style="width:28px;height:28px">' + ic('pencil') + '</button>' +
      '<button class="icon-btn" data-del-todo="' + t.id + '" title="删除" style="width:28px;height:28px">' + ic('trash') + '</button>' +
    '</div></div>';
}

function renderTodos() {
  const now = new Date();
  let list = S.todos.slice();
  const f = UI.todoFilter;
  if (f === 'open') list = list.filter(t => !t.done);
  else if (f === 'today') list = list.filter(t => { const d = parseD(t.due); return !t.done && d && daysBetween(now, d) === 0; });
  else if (f === 'week') list = list.filter(t => { const d = parseD(t.due); return !t.done && d && daysBetween(now, d) >= 0 && daysBetween(now, d) <= 7; });
  else if (f === 'over') list = list.filter(t => { const d = parseD(t.due); return !t.done && d && d < now; });
  else if (f === 'done') list = list.filter(t => t.done);

  list.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const da = parseD(a.due), db = parseD(b.due);
    if (!da && !db) return (a.priority || 2) - (b.priority || 2);
    if (!da) return 1;
    if (!db) return -1;
    if (+da === +db) return (a.priority || 2) - (b.priority || 2);
    return da - db;
  });

  const counts = {
    open: openTodos().length,
    today: S.todos.filter(t => { const d = parseD(t.due); return !t.done && d && daysBetween(now, d) === 0; }).length,
    week: S.todos.filter(t => { const d = parseD(t.due); return !t.done && d && daysBetween(now, d) >= 0 && daysBetween(now, d) <= 7; }).length,
    over: overdueTodos().length,
    done: S.todos.filter(t => t.done).length,
    all: S.todos.length
  };
  const chips = [['open', '进行中'], ['today', '今天'], ['week', '本周'], ['over', '已逾期'], ['done', '已完成'], ['all', '全部']];

  let body = '';
  if (!list.length) {
    body = emptyHTML('check', UI.todoFilter === 'open' ? '没有进行中的待办，轻松一下' : '这个分类下没有内容');
  } else {
    const groups = {};
    list.forEach(t => {
      const d = parseD(t.due);
      let k;
      if (t.done) k = '已完成';
      else if (!d) k = '未设截止';
      else {
        const dd = daysBetween(now, d);
        if (dd < 0) k = '已逾期';
        else if (dd === 0) k = '今天';
        else if (dd === 1) k = '明天';
        else if (dd <= 7) k = '本周内';
        else k = '更晚';
      }
      (groups[k] = groups[k] || []).push(t);
    });
    const order = ['已逾期', '今天', '明天', '本周内', '更晚', '未设截止', '已完成'];
    body = order.filter(k => groups[k]).map(k =>
      '<div style="padding:12px 14px 2px;font-size:11.5px;font-weight:700;color:var(--text-3);letter-spacing:.05em">' +
      esc(k) + ' <span style="opacity:.7">· ' + groups[k].length + '</span></div>' +
      groups[k].map(todoHTML).join('')
    ).join('');
  }

  const donePct = S.todos.length ? Math.round(counts.done / S.todos.length * 100) : 0;

  $('#view').innerHTML =
    '<div class="card mb"><div class="card-b" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">' +
      '<div style="flex:1;min-width:200px">' +
        '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px">' +
          '<span class="muted">完成进度</span><b>' + counts.done + ' / ' + S.todos.length + ' · ' + donePct + '%</b></div>' +
        '<div class="bar"><i style="width:' + donePct + '%"></i></div>' +
      '</div>' +
      (counts.over ? '<span class="badge b-p1">' + ic('warn') + ' ' + counts.over + ' 项已逾期</span>' : '<span class="badge b-ok">' + ic('check') + ' 没有逾期任务</span>') +
    '</div></div>' +

    '<div class="card"><div class="card-h" style="flex-wrap:wrap;gap:10px">' +
      '<h3>' + ic('check') + ' 共 ' + S.todos.length + ' 项</h3>' +
      '<div class="sp" style="flex-wrap:wrap">' +
        chips.map(c => '<button class="chip' + (UI.todoFilter === c[0] ? ' on' : '') + '" data-tf="' + c[0] + '">' + c[1] +
          '<span class="n">' + counts[c[0]] + '</span></button>').join('') +
      '</div></div>' +
      '<div class="card-b flush">' + body + '</div></div>' +
    '<div class="hint mt">从学习通 / 雨课堂 / MOOC 同步来的作业会自动出现在这里，并带上来源标签；也可以把消息一键「转待办」。</div>';

  $$('[data-tf]').forEach(b => b.onclick = () => { UI.todoFilter = b.dataset.tf; renderTodos(); });
  bindTodoEvents();
}

function bindTodoEvents() {
  $$('[data-toggle]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    const t = S.todos.find(x => x.id === el.dataset.toggle);
    if (!t) return;
    t.done = !t.done;
    t.doneAt = t.done ? new Date().toISOString() : null;
    save();
    render();
    if (t.done) toast('已完成：' + t.title, 'ok');
  });
  $$('[data-edit-todo]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    editTodo(S.todos.find(x => x.id === el.dataset.editTodo));
  });
  $$('[data-del-todo]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    const t = S.todos.find(x => x.id === el.dataset.delTodo);
    if (!t) return;
    confirmBox('删除待办', '确定删除「' + esc(t.title) + '」吗？此操作不可撤销。'
      + (String(t.source || '') !== 'manual'
        ? '<br><span class="hint">这条是同步自动生成的。删掉之后同一份通知不会再把它变回来。</span>' : ''), () => {
      dismissId(t.id);           // 记下来，免得下次同步又被自动拉回来
      S.todos = S.todos.filter(x => x.id !== t.id);
      save(); render(); toast('已删除', 'ok');
    }, '删除');
  });
}

function defaultDue(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + (offsetDays == null ? 1 : offsetDays));
  d.setHours(23, 59, 0, 0);
  return ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function editTodo(t) {
  const isNew = !t;
  const cur = t || normTodo({ priority: 2, due: defaultDue() });
  const courseOpts = '<option value="">（不关联课程）</option>' + courseOptionsFor(cur).map(c =>
    '<option value="' + c.id + '"' + ((cur.courseId === c.id || cur.course === c.name) ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('');

  const m = openModal(isNew ? '新建待办' : '编辑待办',
    '<div class="field"><label>任务内容</label>' +
      '<input class="inp" id="fTitle" placeholder="例如：完成数据结构第 3 章作业" value="' + esc(cur.title === '(未命名)' ? '' : cur.title) + '"></div>' +
    '<div class="f-row">' +
      '<div class="field"><label>截止时间</label><input class="inp" type="datetime-local" id="fDue" value="' + esc(cur.due) + '"></div>' +
      '<div class="field"><label>优先级</label><select class="inp" id="fPri">' +
        [1, 2, 3].map(p => '<option value="' + p + '"' + (cur.priority === p ? ' selected' : '') + '>' + ['', '高', '中', '低'][p] + '</option>').join('') +
      '</select></div>' +
    '</div>' +
    '<div class="field"><label>关联课程</label><select class="inp" id="fCourse">' + courseOpts + '</select></div>' +
    '<div class="field"><label>备注</label><textarea class="inp" id="fNote" placeholder="可选：作业范围、提交方式等">' + esc(cur.note) + '</textarea></div>',
    '<button class="btn" data-close>取消</button><button class="btn btn-primary" id="fSave">' + (isNew ? '添加' : '保存') + '</button>');

  $('[data-close]', m).onclick = closeModal;
  $('#fSave', m).onclick = () => {
    const title = $('#fTitle', m).value.trim();
    if (!title) { toast('请填写任务内容', 'warn'); return; }
    const cid = $('#fCourse', m).value;
    const c = S.courses.find(x => x.id === cid);
    const data = {
      title: title,
      due: $('#fDue', m).value,
      priority: +$('#fPri', m).value,
      courseId: cid,
      course: c ? c.name : '',
      note: $('#fNote', m).value.trim()
    };
    if (isNew) {
      S.todos.push(normTodo(Object.assign({ id: uid('t'), source: 'manual' }, data)));
      toast('已添加待办', 'ok');
    } else {
      Object.assign(t, data);
      toast('已保存', 'ok');
    }
    save(); closeModal(); render();
  };
}

/* ============================================================
   学伴 · 04 消息中心 & 课程管理
   ============================================================ */

const KIND_MAP = {
  notice: ['公告', 'b-info'],
  homework: ['作业', 'b-p2'],
  exam: ['考试', 'b-p1'],
  signin: ['签到', 'b-ok']
};

function msgHTML(m, compact) {
  const p = PLAT[m.platform] || { name: m.platform, short: '?', color: '#8A7A63' };
  const c = courseOf(m.courseId) || courseOf(m.course);
  const k = KIND_MAP[m.kind] || ['通知', 'b-p3'];
  return '<div class="msg' + (m.read ? '' : ' unread') + '" data-mid="' + m.id + '">' +
    '<div class="msg-plat" style="background:' + p.color + '">' + esc(p.short) + '</div>' +
    '<div class="msg-b">' +
      '<div class="msg-t">' + (m.read ? '' : '<span class="unread-dot"></span>') + esc(m.title) +
        '<span class="badge ' + k[1] + '" style="height:17px;font-size:10px">' + k[0] + '</span>' +
        (c ? '<span style="font-size:11px;font-weight:600;color:' + c.color + '">' + esc(c.name) + '</span>' : '') + '</div>' +
      (m.content ? '<div class="msg-c">' + esc(m.content) + '</div>' : '') +
      '<div class="msg-m">' +
        '<span style="color:' + p.color + ';font-weight:650">' + esc(p.name) + '</span>' +
        '<span>' + relTime(m.time) + '</span>' +
        (m.deadline ? '<span class="due ' + dueClass(m.deadline) + '">截止 ' + fmtDue(m.deadline) + '</span>' : '') +
        (m.url ? '<a href="' + esc(m.url) + '" target="_blank" rel="noopener" style="font-weight:650">去处理 →</a>' : '') +
        (compact ? '' : '<button class="btn btn-xs btn-ghost" data-mtoggle="' + m.id + '">' + (m.read ? '标为未读' : '标为已读') + '</button>') +
        (compact ? '' : '<button class="btn btn-xs btn-ghost" data-mtodo="' + m.id + '">转待办</button>') +
        (compact ? '' : '<button class="btn btn-xs btn-ghost" data-mdel="' + m.id + '">删除</button>') +
      '</div>' +
    '</div></div>';
}

function renderInbox() {
  let list = S.messages.slice();
  if (UI.msgPlatform !== 'all') list = list.filter(m => m.platform === UI.msgPlatform);
  if (UI.msgUnreadOnly) list = list.filter(m => !m.read);
  if (UI.msgQuery) {
    const q = UI.msgQuery.toLowerCase();
    list = list.filter(m => (m.title + ' ' + m.content + ' ' + m.course).toLowerCase().indexOf(q) >= 0);
  }
  list.sort((a, b) => (parseD(b.time) || 0) - (parseD(a.time) || 0));

  const counts = {};
  S.messages.forEach(m => { counts[m.platform] = (counts[m.platform] || 0) + 1; });

  $('#view').innerHTML =
    '<div class="card"><div class="card-h" style="flex-wrap:wrap;gap:10px">' +
      '<h3>' + ic('inbox') + ' 全部消息 <span class="dim" style="font-weight:500">' + S.messages.length + '</span></h3>' +
      '<div class="sp">' +
        '<input class="inp" id="msgQ" placeholder="搜索标题 / 内容 / 课程" value="' + esc(UI.msgQuery) + '" style="width:220px;height:30px">' +
        '<button class="chip' + (UI.msgUnreadOnly ? ' on' : '') + '" id="unreadOnly">仅未读</button>' +
        '<button class="btn btn-sm" id="markAll">全部已读</button>' +
      '</div></div>' +
      '<div class="card-b" style="padding:12px 14px 10px;display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--border)">' +
        '<button class="chip' + (UI.msgPlatform === 'all' ? ' on' : '') + '" data-mp="all">全部<span class="n">' + S.messages.length + '</span></button>' +
        PLATFORMS.filter(p => counts[p.key]).map(p =>
          '<button class="chip' + (UI.msgPlatform === p.key ? ' on' : '') + '" data-mp="' + p.key + '">' +
          '<i style="width:7px;height:7px;border-radius:50%;background:' + p.color + ';display:block"></i>' +
          esc(p.name) + '<span class="n">' + counts[p.key] + '</span></button>').join('') +
      '</div>' +
      '<div class="card-b flush">' +
        (list.length ? list.map(m => msgHTML(m, false)).join('')
                     : emptyHTML('inbox', S.messages.length ? '没有符合条件的消息' : '收件箱是空的')) +
      '</div></div>' +
    (S.messages.length ? '' :
      '<div class="card mt"><div class="card-b" style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">' +
      '<div class="kpi-ic" style="background:#ECE0CC;color:#8B6F47;flex:0 0 42px">' + ic('bolt') + '</div>' +
      '<div style="flex:1;min-width:230px"><b style="font-size:13.5px">怎么让消息自动进来？</b>' +
      '<p class="hint" style="margin-top:5px">在工作台文件夹里双击 <b>一键同步数据.bat</b>，首次会让你扫码登录学习通 / 雨课堂 / MOOC，' +
      '之后每次运行都会自动抓取新消息并写入本工作台。也可以在「平台入口」页手动录入微助教、微信群里的通知。</p></div>' +
      '<button class="btn btn-primary btn-sm" data-synchelp>查看步骤</button></div></div>');

  const q = $('#msgQ');
  q.oninput = e => {
    UI.msgQuery = e.target.value;
    const pos = e.target.selectionStart;
    renderInbox();
    const q2 = $('#msgQ');
    q2.focus();
    q2.setSelectionRange(pos, pos);
  };
  $('#unreadOnly').onclick = () => { UI.msgUnreadOnly = !UI.msgUnreadOnly; renderInbox(); };
  $('#markAll').onclick = () => {
    S.messages.forEach(m => { m.read = true; });
    save(); render(); toast('已全部标为已读', 'ok');
  };
  $$('[data-mp]').forEach(b => b.onclick = () => { UI.msgPlatform = b.dataset.mp; renderInbox(); });
  const sh = $('[data-synchelp]');
  if (sh) sh.onclick = showSyncHelp;

  $$('.msg').forEach(el => el.onclick = () => {
    const m = S.messages.find(x => x.id === el.dataset.mid);
    if (m && !m.read) { m.read = true; save(); renderSidebar(); renderTopbar(); el.classList.remove('unread'); }
  });
  $$('[data-mtoggle]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const m = S.messages.find(x => x.id === b.dataset.mtoggle);
    if (m) { m.read = !m.read; save(); render(); }
  });
  $$('[data-mdel]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    dismissId(b.dataset.mdel);   // 记下来，免得下次同步又把这条拉回来
    S.messages = S.messages.filter(x => x.id !== b.dataset.mdel);
    save(); render(); toast('已删除', 'ok');
  });
  $$('[data-mtodo]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const m = S.messages.find(x => x.id === b.dataset.mtodo);
    if (!m) return;
    S.todos.push(normTodo({
      title: m.title, due: m.deadline || defaultDue(),
      priority: m.kind === 'homework' ? 1 : 2,
      courseId: m.courseId, course: m.course,
      source: m.platform, url: m.url, note: String(m.content || '').slice(0, 300)
    }));
    save(); toast('已转为待办', 'ok'); render();
  });
}

/* ==================== 课程管理 ==================== */

/* 平台抓来的课程详情（目前只有中国大学 MOOC 会带 detail）。
   以前适配器只调了一个「最近在学的课」接口、拿到课名就收工了，
   所以这里永远是空的 —— 点进课程什么也看不到。
   详情要靠 sync/adapters/icourse163.py 真的去读课程结构接口才会出现。 */
function courseDetailHTML(c) {
  const d = c.detail;
  if (!d || typeof d !== 'object') return '';
  const pr = d.progress || {};
  const done = +pr.done || 0, total = +pr.total || 0;
  const pct = total ? Math.round(done / total * 100) : 0;
  const endD = parseD(d.endAt);
  const ended = !!(endD && endD.getTime() < Date.now());
  const chapters = d.chapters || [], quizzes = d.quizzes || [], exams = d.exams || [];

  let h = '<div class="sec-title">平台课程详情' +
    (d.fetchedAt ? '<span class="dim" style="font-size:11.5px;font-weight:400">同步于 ' + esc(relTime(d.fetchedAt)) + '</span>' : '') +
    '</div>';

  if (d.startAt || d.endAt) {
    h += '<div class="row"><div class="row-main"><div class="row-title">' +
      esc((d.startAt || '?') + ' ~ ' + (d.endAt || '?')) +
      (ended ? '<span class="badge b-p3">已结束</span>' : '<span class="badge b-ok">进行中</span>') +
      '</div><div class="row-meta"><span>' + chapters.length + ' 章</span>' +
      '<span>' + quizzes.length + ' 个章节测验</span>' +
      '<span>' + exams.length + ' 场考试</span></div></div></div>';
  } else if (chapters.length) {
    h += '<div class="row"><div class="row-main"><div class="row-meta">' +
      '<span>' + chapters.length + ' 章</span><span>' + quizzes.length + ' 个章节测验</span></div></div></div>';
  }

  if (total) {
    h += '<div class="row"><div class="row-main">' +
      '<div class="row-title">学习进度 ' + done + ' / ' + total + ' 讲' +
        (done >= total ? '<span class="badge b-ok">已看完</span>' : '') + '</div>' +
      '<div style="height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-top:7px">' +
        '<i style="display:block;height:100%;width:' + (pct ? pct : 2) + '%;background:' +
        (done >= total ? 'var(--green)' : (done ? 'var(--primary)' : 'var(--orange)')) + '"></i>' +
      '</div></div></div>';
  }

  if (chapters.length) {
    h += '<div class="sec-title">章节 · ' + chapters.length + ' 章</div>' +
      '<div style="max-height:200px;overflow:auto">' + chapters.map(ch => {
        const t = +ch.lessons || 0, dn = +ch.done || 0;
        return '<div class="row"><div class="row-main"><div class="row-title">' + esc(ch.name) + '</div>' +
          '<div class="row-meta"><span>' + t + ' 讲</span><span>' +
          (dn ? '已看 ' + dn : '未开始') + '</span></div></div></div>';
      }).join('') + '</div>';
  }

  if (quizzes.length) {
    h += '<div class="sec-title">章节测验 · ' + quizzes.length + ' 个</div>' +
      '<div style="max-height:200px;overflow:auto">' + quizzes.map(q =>
        '<div class="row"><div class="row-main"><div class="row-title">' + esc(q.name) + '</div>' +
        (q.due ? '<div class="row-meta"><span>截止 ' + esc(q.due) + '</span></div>' : '') +
        '</div></div>').join('') + '</div>';
  }

  if (exams.length) {
    h += '<div class="sec-title">考试 · ' + exams.length + ' 场</div>' + exams.map(e => {
      const ed = parseD(e.due);
      const past = !!(ed && ed.getTime() < Date.now());
      return '<div class="row"><div class="row-main"><div class="row-title">' + esc(e.name) +
        (ed ? '<span class="badge ' + (past ? 'b-p3' : 'b-p2') + '">' +
          (past ? '已截止 ' : '截止 ') + esc(e.due) + '</span>' : '') +
        '</div>' +
        (e.description ? '<div class="row-meta" style="display:block;line-height:1.65;margin-top:4px">' +
          esc(e.description) + '</div>' : '') +
        '</div></div>';
    }).join('');
  }
  return h;
}

function courseCard(c) {
  const full = '1-' + (S.settings.totalWeeks - 2);
  const sess = (c.sessions || []).map(s => '周' + WD[s.day - 1] + ' 第' + s.start + '-' + (s.start + s.len - 1) + '节' +
    (s.weeks && s.weeks !== full ? ' (' + s.weeks + ')' : '') + (s.room ? ' ' + s.room : '')).join('；');
  const p = PLAT[c.platform];
  const nTodo = S.todos.filter(t => !t.done && (t.courseId === c.id || t.course === c.name)).length;
  const nMsg = S.messages.filter(m => m.courseId === c.id || m.course === c.name).length;
  return '<div class="course" data-cid="' + c.id + '" style="--c:' + c.color + '">' +
    '<div class="course-t">' + esc(c.name) +
      (nTodo ? '<span class="badge b-p2" style="margin-left:8px;height:18px">' + nTodo + ' 待办</span>' : '') + '</div>' +
    '<div class="course-m">' +
      (c.teacher ? '<i>' + ic('user') + esc(c.teacher) + '</i>' : '') +
      (sess ? '<i>' + ic('clock') + esc(sess) + '</i>' : '<i>' + ic('clock') + '<span class="dim">未排课</span></i>') +
      (c.credits ? '<i>' + ic('file') + esc(c.credits) + ' 学分</i>' : '') +
      (c.school ? '<i>' + ic('target') + esc(c.school) + '</i>' : '') +
      (c.detail && c.detail.progress && c.detail.progress.total
        ? '<i>' + ic('check') + '进度 ' + (+c.detail.progress.done || 0) + '/' + c.detail.progress.total + ' 讲</i>' : '') +
      (p ? '<i>' + ic('link') + esc(p.name) + '</i>' : '') +
      (nMsg ? '<i>' + ic('inbox') + nMsg + ' 条消息</i>' : '') +
    '</div>' +
    '<div class="course-a">' +
      (c.url ? '<a class="btn btn-xs btn-primary" href="' + esc(c.url) + '" target="_blank" rel="noopener">进入课程</a>' : '') +
      (!c.url && p && p.home ? '<a class="btn btn-xs btn-primary" href="' + esc(p.home) + '" target="_blank" rel="noopener">打开' + esc(p.name) + '</a>' : '') +

      '<button class="btn btn-xs btn-danger" data-cdel="' + c.id + '">删除</button>' +
    '</div></div>';
}

function renderCourses() {
  const mine = myCourses().length;
  const all = S.courses.length;
  const hidden = Math.max(0, all - mine);
  /* 默认只看本学期在上的课；平台同步回来的课程池切到「全部」才显示。 */
  const base = UI.courseAll ? S.courses.slice() : myCourses();
  let list = base;
  if (UI.courseQuery) {
    const q = UI.courseQuery.toLowerCase();
    list = list.filter(c => (c.name + ' ' + c.teacher + ' ' + (c.note || '')).toLowerCase().indexOf(q) >= 0);
  }
  const totalCredits = base.reduce((n, c) => n + (parseFloat(c.credits) || 0), 0);

  const tabs = '<div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">' +
    '<button class="chip' + (UI.courseAll ? '' : ' on') + '" id="cTabMine">本学期<span class="n">' + mine + '</span></button>' +
    '<button class="chip' + (UI.courseAll ? ' on' : '') + '" id="cTabAll">全部<span class="n">' + all + '</span></button>' +
    (UI.courseAll && hidden
      ? '<span class="dim" style="font-size:12px">其中 ' + hidden + ' 门来自平台同步，' +
        '多为往期课程、可以删掉</span>'
      : '') +
    '</div>';

  $('#view').innerHTML =
    '<div class="card mb"><div class="card-h" style="flex-wrap:wrap;gap:10px">' +
      '<h3>' + ic('book') + ' ' + (UI.courseAll ? '全部课程' : '本学期课程') +
        ' · ' + base.length + ' 门' +
        (totalCredits ? ' · ' + (Math.round(totalCredits * 10) / 10) + ' 学分' : '') + '</h3>' +
      '<div class="sp">' +
        '<input class="inp" id="cQ" placeholder="搜索课程 / 老师" value="' + esc(UI.courseQuery) + '" style="width:180px;height:30px">' +
        '<button class="btn btn-sm btn-primary" id="addCourse">' + ic('plus') + '新增课程</button>' +
      '</div></div>' +
      '<div class="card-b" style="padding:11px 14px;border-top:1px solid var(--border)">' + tabs + '</div></div>' +
    (base.length
      ? (list.length ? '<div class="grid g-auto">' + list.map(courseCard).join('') + '</div>'
                     : '<div class="card"><div class="card-b">' + emptyHTML('search', '没有匹配的课程') + '</div></div>')
      : '<div class="card"><div class="card-b">' + emptyHTML('book', '还没有课程。手动新增，或者在课表里点空白格子快速添加。') +
        '<div style="text-align:center"><button class="btn btn-primary mt" id="addCourse2">' + ic('plus') + '新增第一门课程</button></div></div></div>') +
    (UI.courseAll
      ? '<div class="hint mt">这里的「平台同步课程」是学习通 / 雨课堂 / MOOC 的课程池，包含往期课程 —— 它们没有课表时段，不参与课表统计。只想过一遍本学期在上的，切回上面的「本学期」。</div>'
      : (hidden
          ? '<div class="hint mt">另有 ' + hidden + ' 门平台同步的往期课程被收起，需要查看或清理时点上面的「全部」。</div>'
          : '<div class="hint mt">提示：「进入课程」链接建议填该课程在平台上的主页地址，之后就能一键跳转，不用再到处找。</div>'));

  const t1 = $('#cTabMine'), t2 = $('#cTabAll');
  if (t1) t1.onclick = () => { UI.courseAll = false; renderCourses(); };
  if (t2) t2.onclick = () => { UI.courseAll = true; renderCourses(); };

  const cq = $('#cQ');
  cq.oninput = e => {
    UI.courseQuery = e.target.value;
    const pos = e.target.selectionStart;
    renderCourses();
    const c2 = $('#cQ');
    c2.focus();
    c2.setSelectionRange(pos, pos);
  };
  const a1 = $('#addCourse'), a2 = $('#addCourse2');
  if (a1) a1.onclick = () => editCourse(null);
  if (a2) a2.onclick = () => editCourse(null);
  $$('.course').forEach(el => el.onclick = e => {
    if (e.target.closest('a,button')) return;
    openCourse(el.dataset.cid);
  });
  $$('[data-cedit]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    editCourse(S.courses.find(x => x.id === b.dataset.cedit));
  });
  $$('[data-cdel]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const c = S.courses.find(x => x.id === b.dataset.cdel);
    if (!c) return;
    confirmBox('删除课程', '确定删除「' + esc(c.name) + '」及其课表排课吗？关联的待办和消息会保留下来。', () => {
      S.courses = S.courses.filter(x => x.id !== c.id);
      save(); render(); toast('已删除课程', 'ok');
    }, '删除');
  });
}

function sessRowHTML(s, i) {
  const maxSec = sections().length;
  let dayOpts = '';
  for (let k = 1; k <= 7; k++) dayOpts += '<option value="' + k + '"' + (+s.day === k ? ' selected' : '') + '>周' + WD[k - 1] + '</option>';
  let startOpts = '';
  for (let k = 1; k <= maxSec; k++) startOpts += '<option value="' + k + '"' + (+s.start === k ? ' selected' : '') + '>' + k + '</option>';
  let lenOpts = '';
  Array.from({ length: maxSec }, (_, n) => n + 1).forEach(function (l) { lenOpts += '<option value="' + l + '"' + (+s.len === l ? ' selected' : '') + '>' + l + ' 节</option>'; });
  return '<div class="sess-row" style="display:flex;gap:7px;align-items:center;margin-bottom:7px;flex-wrap:wrap">' +
    '<select class="inp s-day" aria-label="上课星期" style="width:80px;flex:0 0 80px">' + dayOpts + '</select>' +
    '<span class="dim" style="font-size:12px">第</span>' +
    '<select class="inp s-start" aria-label="开始节次" style="width:64px;flex:0 0 64px">' + startOpts + '</select>' +
    '<select class="inp s-len" aria-label="连上几节" style="width:80px;flex:0 0 80px">' + lenOpts + '</select>' +
    '<input class="inp s-room" style="flex:1;min-width:90px" value="' + esc(s.room || '') + '" placeholder="教室">' +
    '<button type="button" class="icon-btn s-del" style="width:28px;height:28px;flex:0 0 28px">' + ic('trash') + '</button>' +
    weekRuleHTML(s.weeks || '1-18') + '</div>';
}
function bindSess(m) {

}

  const isNew = !c;
  const full = '1-' + (S.settings.totalWeeks - 2);
  const cur = c || {
    id: uid('c'), name: '', teacher: '', platform: '', url: '',
    color: PALETTE[S.courses.length % PALETTE.length], credits: '', note: '',
    sessions: [preset
      ? { day: preset.day, start: preset.start, len: preset.len, weeks: preset.weeks, room: '' }
      : { day: 1, start: 1, len: 2, weeks: full, room: '' }]
  };
  const sessRows = (cur.sessions || []).map(sessRowHTML).join('');

  const m = openModal(isNew ? '新增课程' : '编辑课程',
    '<div class="field"><label>课程名称</label>' +
      '<input class="inp" id="cfName" placeholder="例如：数据结构" value="' + esc(cur.name) + '"></div>' +
    '<div class="f-row">' +
      '<div class="field"><label>授课老师</label><input class="inp" id="cfTeacher" value="' + esc(cur.teacher) + '"></div>' +
      '<div class="field"><label>学分</label><input class="inp" id="cfCredits" placeholder="选填" value="' + esc(cur.credits) + '"></div>' +
    '</div>' +

    (sess || '<div class="dim" style="font-size:12.5px">未排课</div>') +

    '<div class="sec-title">待办 · ' + todos.filter(t => !t.done).length + ' 项未完成</div>' +

    (msgs.length ? msgs.slice(0, 8).map(mm => msgHTML(mm, true)).join('') : '<div class="dim" style="font-size:12.5px">暂无同步的消息</div>'),
    '<button class="btn" data-close>关闭</button>' +

    '<button class="btn btn-primary" id="ocEdit">' + ic('pencil') + '编辑课程</button>',
    { wide: true });

  const m = modalStack[modalStack.length - 1];
  $('[data-close]', m).onclick = closeModal;
  $('#ocEdit', m).onclick = () => { closeModal(); editCourse(c); };
  $('#ocAddTodo', m).onclick = () => {

    editTodo(normTodo({ courseId: c.id, course: c.name, title: c.name + '：', priority: 2, due: defaultDue() }));

function cetDailyDone(dateStr) {
  const r = S.cet.daily[dateStr] || {};
  return Object.values(r).filter(Boolean).length;
}
function cetStreak() {
  let n = 0;
  const d = new Date();
  if (cetDailyDone(ymd(d)) === 0) d.setDate(d.getDate() - 1);
  for (let i = 0; i < 400; i++) {
    if (cetDailyDone(ymd(d)) > 0) { n++; d.setDate(d.getDate() - 1); }
    else break;
  }
  return n;
}
function cetProgressPct() {
  const st = parseD((S.cet.startedAt || ymd(new Date())) + 'T00:00:00');
  const ex = parseD(S.cet.examDate + 'T00:00:00');
  if (!st || !ex) return 0;
  const total = Math.max(1, daysBetween(st, ex));
  const done = Math.max(0, daysBetween(st, new Date()));
  return Math.min(100, Math.round(done / total * 100));
}

const CET_PLAN = {
  'CET-4': [
    ['第 1-4 周', '高频词 1500 · 每天 50 个', '吃透听力短对话 + 长对话套路'],
    ['第 5-8 周', '核心词收尾 · 每天 40 个', '仔细阅读精做 2 篇/天，整理同义替换'],
    ['第 9-12 周', '真题词汇查漏', '写作模板成型，翻译每天 1 句'],
    ['第 13 周-考前', '全真模考每周 2 套', '错题复盘，作文背 5 篇范文']
  ],
  'CET-6': [
    ['第 1-4 周', '六级核心词 2000 · 每天 50 个', '听力精听 1 篇/天，跟读记笔记'],
    ['第 5-8 周', '词汇第二轮 + 熟词僻义', '阅读限时训练 15 分钟/篇，正确率 ≥ 70%'],
    ['第 9-12 周', '真题高频词收尾', '写作背 8 篇范文，翻译练中国特色表达'],
    ['第 13 周-考前', '全真模考每周 2 套 + 复盘', '保持手感，作文限时 30 分钟成稿']
  ]
};

function renderCET() {
  const now = new Date();
  const exam = parseD(S.cet.examDate + 'T00:00:00');
  const dExam = exam ? Math.max(0, daysBetween(now, exam)) : 0;
  const today = ymd(now);
  const rec = S.cet.daily[today] || {};
  const doneN = Object.values(rec).filter(Boolean).length;
  const pct = Math.round(doneN / S.cet.tasks.length * 100);
  const streak = cetStreak();
  const totalDays = Object.keys(S.cet.daily).filter(k => cetDailyDone(k) > 0).length;
  const R = 44, C = 2 * Math.PI * R;

  const days = [];
  for (let i = 27; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }

  const isExamDay = dExam === 0;
  const weeksLeft = Math.ceil(dExam / 7);

  $('#view').innerHTML =
    finalExamsHTML() +
    '<div class="grid g-dash">' +
      '<div class="card"><div class="card-h">' +
        '<h3>' + ic('target') + ' ' + esc(S.cet.type) + ' 备考看板</h3>' +
        '<div class="sp"><div class="seg" id="cetType">' +
          ['CET-4', 'CET-6'].map(t => '<button data-t="' + t + '" class="' + (S.cet.type === t ? 'on' : '') + '">' + t + '</button>').join('') +
        '</div></div></div>' +
        '<div class="card-b">' +
          '<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">' +
            '<div class="ring"><svg width="104" height="104">' +
              '<circle cx="52" cy="52" r="' + R + '" fill="none" stroke="#E6DBC4" stroke-width="9"/>' +
              '<circle cx="52" cy="52" r="' + R + '" fill="none" stroke="#5F7A4A" stroke-width="9" stroke-linecap="round" ' +
              'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pct / 100)).toFixed(1) + '"/></svg>' +
              '<div class="ring-t"><b>' + pct + '%</b><span>今日进度</span></div></div>' +
            '<div style="flex:1;min-width:210px">' +
              '<div style="display:flex;gap:22px;margin-bottom:14px;flex-wrap:wrap">' +
                '<div><div class="kpi-v">' + dExam + '</div><div class="kpi-k">距考试（天）</div></div>' +
                '<div><div class="kpi-v">' + streak + '</div><div class="kpi-k">连续打卡（天）</div></div>' +
                '<div><div class="kpi-v">' + totalDays + '</div><div class="kpi-k">累计打卡（天）</div></div>' +
              '</div>' +
              '<div class="bar"><i style="width:' + cetProgressPct() + '%"></i></div>' +
              '<div class="hint" style="margin-top:6px">备考周期进度 ' + cetProgressPct() + '%（自 ' + esc(S.cet.startedAt) + ' 起算）· 还剩约 ' + weeksLeft + ' 周</div>' +
              (isExamDay ? '<div class="badge b-p1 mt">考试就在今天，全力以赴！</div>' : '') +
            '</div>' +
          '</div>' +
        '</div></div>' +

      '<div class="card"><div class="card-h"><h3>' + ic('cal') + ' 考试信息</h3></div>' +
        '<div class="card-b">' +
          '<div class="f-row">' +
            '<div class="field"><label>考试日期</label><input class="inp" type="date" id="cetDate" value="' + esc(S.cet.examDate) + '"></div>' +
            '<div class="field"><label>目标分数</label><input class="inp" type="number" id="cetScore" value="' + S.cet.targetScore + '" min="0" max="710"></div>' +
          '</div>' +
          '<div class="field"><label>备考起始日</label><input class="inp" type="date" id="cetStart" value="' + esc(S.cet.startedAt) + '"></div>' +
          '<div class="hint">2026 年下半年四六级笔试通常在 12 月第三个周六（2026-12-19）。<b>请以教务处正式通知为准</b>，通知下来后在这里改一下日期即可。</div>' +
        '</div></div>' +
    '</div>' +

    '<div class="grid g-2 mt">' +
      '<div class="card"><div class="card-h"><h3>' + ic('check') + ' 今日任务</h3>' +
        '<div class="sp"><span class="dim" style="font-size:12px">' + doneN + ' / ' + S.cet.tasks.length + ' 已完成</span></div></div>' +
        '<div class="card-b">' +
          S.cet.tasks.map(t => {
            const on = !!rec[t.id];
            return '<div class="task-line">' +
              '<div class="check' + (on ? ' on' : '') + '" data-cet="' + t.id + '">' + ic('check') + '</div>' +
              '<div class="nm">' + esc(t.name) + '</div>' +
              '<span class="dim" style="font-size:12px">目标 ' + t.goal + ' ' + esc(t.unit) + '</span>' +
              (on ? '<span class="badge b-ok">已完成</span>' : '<span class="badge b-p3">待完成</span>') +
              '</div>';
          }).join('') +
          '<div class="hint" style="margin-top:10px">点左侧方框打卡，数据保存在本机浏览器，换设备请用「设置 → 导出备份」。</div>' +
        '</div></div>' +

      '<div class="card"><div class="card-h"><h3>' + ic('fire') + ' 最近 28 天打卡</h3>' +
        '<div class="sp"><span class="badge b-ok">连续 ' + streak + ' 天</span></div></div>' +
        '<div class="card-b"><div class="streak">' +
          days.map(d => {
            const s = ymd(d);
            const n = cetDailyDone(s);
            const cls = n > 0 ? ' on' : (daysBetween(d, now) < 0 ? ' future' : '');
            return '<div class="day' + cls + (s === today ? ' today' : '') + '" title="' + s + '：' + n + '/' + S.cet.tasks.length + ' 项">' +
              d.getDate() + '</div>';
          }).join('') +
        '</div>' +
        '<div class="hint" style="margin-top:10px">绿色 = 当天有打卡。保持连续，别断节奏——断一天就得从头数。</div>' +
        '</div></div>' +
    '</div>' +

    '<div class="sec-title">' + esc(S.cet.type) + ' 阶段计划</div>' +
    '<div class="grid g-4">' +
      (CET_PLAN[S.cet.type] || CET_PLAN['CET-6']).map((row, i) => {
        const started = parseD(S.cet.startedAt + 'T00:00:00');
        const wkNow = started ? Math.floor(Math.max(0, daysBetween(started, now)) / 7) + 1 : 1;
        const ranges = [[1, 4], [5, 8], [9, 12], [13, 99]];
        const active = wkNow >= ranges[i][0] && wkNow <= ranges[i][1];
        return '<div class="card"' + (active ? ' style="background:var(--primary-w)"' : '') + '>' +
          '<div class="card-b">' +
            '<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">' +
              '<b style="font-size:13.5px">' + esc(row[0]) + '</b>' +
              (active ? '<span class="badge b-info">进行中</span>' : '<span class="badge b-p3">未开始／已过</span>') +
            '</div>' +
            '<div style="font-size:12.5px;color:var(--text-2);line-height:1.7">' +
              '<div>· ' + esc(row[1]) + '</div><div>· ' + esc(row[2]) + '</div>' +
            '</div>' +
          '</div></div>';
      }).join('') +
    '</div>';

  $$('[data-cet]').forEach(el => el.onclick = () => {
    const id = el.dataset.cet;
    S.cet.daily[today] = S.cet.daily[today] || {};
    S.cet.daily[today][id] = !S.cet.daily[today][id];
    if (!Object.values(S.cet.daily[today]).some(Boolean)) delete S.cet.daily[today];
    save();
    renderCET();
    renderSidebar();
    const n = Object.values(S.cet.daily[today] || {}).filter(Boolean).length;
    if (n === S.cet.tasks.length) toast('今日全部任务完成，漂亮！', 'ok');
  });
  $$('#cetType button').forEach(b => b.onclick = () => {
    S.cet.type = b.dataset.t; save(); renderCET(); renderTopbar();
  });
  $('#cetDate').onchange = e => { S.cet.examDate = e.target.value; save(); renderTopbar(); renderCET(); };
  $('#cetScore').onchange = e => { S.cet.targetScore = +e.target.value || 500; save(); renderCET(); };
  $('#cetStart').onchange = e => { S.cet.startedAt = e.target.value; save(); renderCET(); };
  bindFinalExams();
}

/* 期末考试与四六级分别保存，不互相覆盖日期。 */
function finalExamStatus(date, now) {
  const exam = parseD(date + 'T00:00:00');
  if (!exam || ymd(exam) !== date) return { text: '日期无效', days: null, cls: 'b-p1' };
  const days = daysBetween(now || new Date(), exam);
  return { days: days, text: days < 0 ? '已结束 ' + (-days) + ' 天' : (days === 0 ? '今天考试' : '还有 ' + days + ' 天'), cls: days < 0 ? 'b-p3' : (days <= 7 ? 'b-p2' : 'b-info') };
}

function finalExamsHTML() {
  const exams = (S.cet.finalExams || []).slice().sort((a, b) => a.date.localeCompare(b.date));
  const next = exams.find(e => finalExamStatus(e.date).days !== null && finalExamStatus(e.date).days >= 0);
  const count = next ? finalExamStatus(next.date) : null;
  return '<div class="card mb final-exams"><div class="card-h"><h3>' + ic('cal') + ' 期末考试倒计时</h3>' +
    '<div class="sp"><button class="btn btn-sm btn-primary" id="addFinalExam">' + ic('plus') + '添加期末考试</button></div></div>' +
    '<div class="card-b">' + (next ? '<div class="final-next"><div><span class="muted">下一场期末考试</span><h3>' + esc(next.title) + '</h3><span>' + esc(next.date) + (next.room ? ' · ' + esc(next.room) : '') + '</span></div>' +
      '<div><b class="kpi-v">' + count.days + '</b><span> 天' + (count.days === 0 ? ' · 今天考试' : '后考试') + '</span></div></div>' :
      '<p class="hint">' + (exams.length ? '已录入的考试均已结束，可添加下一场考试。' : '添加各科期末日期，或先填写「期末考试开始」日期，倒计时会自动计算。') + '</p>') +
    exams.map(e => {
      const status = finalExamStatus(e.date);
      return '<div class="row"><div class="row-main"><div class="row-title">' + esc(e.title) + '</div><div class="row-meta">' + esc(e.date) +
        (e.room ? ' · ' + esc(e.room) : '') + (e.note ? ' · ' + esc(e.note) : '') + '</div></div>' +
        '<span class="badge ' + status.cls + '">' + status.text + '</span><div class="row-act"><button class="btn btn-xs" data-final-edit="' + esc(e.id) + '">编辑</button>' +
        '<button class="btn btn-xs" data-final-delete="' + esc(e.id) + '">删除</button></div></div>';
    }).join('') + '</div></div>';
}

function bindFinalExams() {
  $('#addFinalExam').onclick = () => editFinalExam(null);
  $$('[data-final-edit]').forEach(b => b.onclick = () => editFinalExam(S.cet.finalExams.find(e => e.id === b.dataset.finalEdit)));
  $$('[data-final-delete]').forEach(b => b.onclick = () => {
    const exam = S.cet.finalExams.find(e => e.id === b.dataset.finalDelete); if (!exam) return;
    confirmBox('删除考试安排', '确定删除「' + esc(exam.title) + '」？不会删除关联课程或待办。', () => {
      S.cet.finalExams = S.cet.finalExams.filter(e => e.id !== exam.id); save(); renderCET();
    }, '删除');
  });
}

function editFinalExam(exam) {
  const current = exam || { id: uid('final'), title: '', date: '', courseId: '', room: '', note: '' };
  const modal = openModal(exam ? '编辑期末考试' : '添加期末考试',

    if (exam) Object.assign(exam, value); else S.cet.finalExams.push(value);
    save(); closeModal(); renderCET(); toast('期末考试日期已保存', 'ok');
  };
}

/* ==================== 平台入口 ==================== */
function platCard(p, connection) {
  const connected = connection && connection.status === 'connected';
  const failed = connection && connection.status === 'error';
  // needs_login 必须单独成一档。以前它掉进「待连接」，跟「从没同步过」长得一模一样，
  // 于是登录过期后定时同步天天静默跳过，页面上却看不出任何异常。
  const needsLogin = connection && connection.status === 'needs_login';
  const statusText = connected ? '已连接'
    : (failed ? '同步失败'
    : (needsLogin ? '登录已过期'
    : (p.auto ? '待连接' : '手动录入')));
  const statusClass = connected ? 'b-ok' : (failed ? 'b-p1' : (needsLogin ? 'b-p2' : 'b-p3'));

  // 登录态倒计时。能提前算出来，是因为 cookie 的到期时间是平台服务端写死的
  // —— 实测反复同步并不会续期，所以「还剩几天」是个可靠的数字。
  const days = (connection && typeof connection.daysLeft === 'number') ? connection.daysLeft : null;
  const hs = connection && connection.loginStatus;
  let expiryBadge = '';
  let expiryHint = '';
  if (connected && days !== null && hs !== 'session') {
    if (hs === 'expiring') {
      expiryBadge = '<span class="badge b-warn">' + ic('clock') + '登录态剩 ' + days + ' 天</span>';
      expiryHint = '<div class="hint" style="margin-top:6px;color:var(--orange)">' +
        (connection.expiresAt ? connection.expiresAt.slice(0, 10) + ' 到期，' : '') +
        '双击工作台文件夹里的「重新登录.bat」扫码续期即可。到期后自动同步会跳过这个平台。</div>';
    } else if (hs === 'ok') {
      expiryBadge = '<span class="badge b-ok">' + ic('clock') + '登录态剩 ' + days + ' 天</span>';
    }
  }

  return '<div class="card hoverable">' +
    '<div class="plat">' +
      '<div class="plat-ic" style="background:' + p.color + '">' + esc(p.short) + '</div>' +
      '<div class="plat-b"><b>' + esc(p.name) + '</b><p>' + esc(p.desc) + '</p>' +
        '<div style="display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center">' +
          (p.home ? '<a class="btn btn-xs btn-primary" href="' + esc(p.home) + '" target="_blank" rel="noopener">打开 ' + ic('ext') + '</a>' : '') +
          (p.work ? '<a class="btn btn-xs" href="' + esc(p.work) + '" target="_blank" rel="noopener">作业</a>' : '') +
          (p.notice ? '<a class="btn btn-xs" href="' + esc(p.notice) + '" target="_blank" rel="noopener">通知</a>' : '') +
          (p.spoc ? '<a class="btn btn-xs" href="' + esc(p.spoc) + '" target="_blank" rel="noopener">校内 SPOC</a>' : '') +
          '<span class="badge ' + statusClass + '">' + statusText + '</span>' +
          expiryBadge +
        '</div>' +
        (connected && connection.lastSync ? '<div class="hint" style="margin-top:6px">最近同步：' + relTime(connection.lastSync) + '</div>' : '') +
        (failed && connection.error ? '<div class="hint" style="margin-top:6px;color:var(--red)">' + esc(connection.error) + '</div>' : '') +
        (needsLogin ? '<div class="hint" style="margin-top:6px;color:var(--orange)">登录态已过期，自动同步会跳过它。双击工作台文件夹里的「重新登录.bat」扫码即可恢复。</div>' : '') +
        expiryHint +
        (p.note ? '<div class="hint" style="margin-top:6px">' + esc(p.note) + '</div>' : '') +
      '</div>' +
    '</div></div>';
}

          myCourses().map(c => '<option value="' + c.id + '">' + esc(c.name) + '</option>').join('') + '</select></div>' +

      '</div>' +

  $('#pSync').onclick = API.connected ? triggerSync : showSyncHelp;

      kind: $('#pmKind').value, deadline: $('#pmDue').value
    }));
    save(); toast('已录入消息', 'ok'); renderPlat();
  };
}

/* ==================== 导入导出 ==================== */
function download(name, text, type) {
  const blob = new Blob([text], { type: type || 'application/json;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function exportJSON() {
  const d = new Date();
  const name = '学伴备份_' + ymd(d) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
  download(name, JSON.stringify(S, null, 2));
  toast('已导出备份文件', 'ok');
}
function importJSON() {
  pickFile('.json,application/json', txt => {
    let obj;
    try { obj = JSON.parse(txt); } catch (e) { toast('文件不是合法的 JSON', 'err'); return; }
    if (!obj || typeof obj !== 'object') { toast('文件内容无法识别', 'err'); return; }
    confirmBox('导入备份', '导入后会<b>覆盖</b>当前所有数据。建议先导出一次备份。确定继续吗？', () => {
      S = Object.assign(defaultState(), obj);
      S.settings = Object.assign(defaultState().settings, obj.settings || {});
      S.cet = Object.assign(defaultState().cet, obj.cet || {});
      S.meta = Object.assign(defaultState().meta, obj.meta || {});
      save(); render();
      toast('导入成功', 'ok');
    }, '覆盖导入');
  });
}
function importSyncFile() {
  pickFile('.json,application/json', txt => {
    let obj;
    try { obj = JSON.parse(txt); } catch (e) { toast('文件不是合法的 JSON', 'err'); return; }
    const n = mergePayload(obj, false);
    save(); render();
    toast('同步完成：新增 ' + n.msgs + ' 条消息、' + n.todos + ' 项待办、' + n.courses + ' 门课程', 'ok');
  });
}
function pickFile(accept, cb) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = accept || '';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => cb(String(fr.result));
    fr.readAsText(f, 'utf-8');
  };
  inp.click();
}

/* ==================== 每天自动同步 ====================
   真正的定时执行者是 Windows 计划任务（sync/register_task.ps1），不是这个页面。
   页面只做两件事：把开关/时间下发过去，以及**回读系统里的真实状态**来显示。
   为什么不做成「页面开着时自己定时」：学生不会整天开着这个页面，那样等于没做；
   而且两边同时到点会各起一个浏览器抢同一个 profile。
*/
const SCHED = { loaded: false, enabled: false, mode: 'unknown', times: [], lastRun: null, busy: false, note: '' };

function nextRunText(times) {
  if (!times || !times.length) return '';
  const now = new Date();
  let best = null;
  for (let d = 0; d <= 2; d++) {
    times.forEach(t => {
      const p = String(t).split(':');
      const dt = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d, +p[0] || 0, +p[1] || 0, 0, 0);
      if (dt > now && (!best || dt < best)) best = dt;
    });
  }
  if (!best) return '';
  const hm = pad(best.getHours()) + ':' + pad(best.getMinutes());
  const days = Math.round((new Date(best.getFullYear(), best.getMonth(), best.getDate())
    - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  if (days === 0) return '今天 ' + hm;
  if (days === 1) return '明天 ' + hm;
  return (best.getMonth() + 1) + ' 月 ' + best.getDate() + ' 日 ' + hm;
}

function schedBoxHTML() {
  const m = SCHED.mode;
  let head, sub, tone;
  if (!API.connected) {
    tone = 'offline';
    head = '需要完整模式';
    sub = '双击「启动工作台.bat」打开完整模式后，才能开启系统级定时同步。';
  } else if (m === 'task') {
    tone = 'online';
    head = '已开启 · 由 Windows 计划任务执行';
    sub = '到点自动抓取，<b>不需要开着工作台，也不会弹出浏览器窗口</b>。';
  } else if (m === 'startup') {
    tone = 'online';
    head = '已开启 · 开机自启（备用方案）';
    sub = '这台电脑注册计划任务被系统拦下了，退而求其次放进启动文件夹，每次登录后跑一次。';
  } else if (m === 'none') {
    tone = 'offline';
    head = '未开启';
    sub = '打开右边这个开关，就会交给系统每天定时抓取；错过的时段会在开机后补跑一次。';
  } else {
    tone = 'offline';
    head = SCHED.busy ? '正在处理…' : '状态未知';
    sub = '点下方的「刷新状态」重新读取。';
  }

  const times = (SCHED.times && SCHED.times.length) ? SCHED.times
    : String(S.settings.syncTimes || '08:00,20:00').split(/[,，;；\s]+/).filter(Boolean);
  const nextTxt = (SCHED.enabled && m === 'task') ? nextRunText(times) : '';
  const lastRunTxt = S.meta.lastSync
    ? '上次同步：' + esc(new Date(S.meta.lastSync).toLocaleString('zh-CN'))
      + (S.meta.syncNote ? '（' + esc(S.meta.syncNote) + '）' : '')
    : '上次同步：还没有同步过';

  return '<div class="storage-status ' + tone + '">' +
      '<span class="sync-dot ' + (tone === 'online' ? 'ok' : 'bad') + '"></span>' +
      '<div><b>' + head + '</b><span>' + sub + '</span></div>' +
    '</div>' +
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px">' +
      '<label class="switch' + (SCHED.enabled ? ' on' : '') + '" id="stAutoSync" style="margin:0;flex:1;min-width:260px">' +
        '<span class="sw"></span>' +
        '<span class="tx"><b>每天自动同步' + (SCHED.enabled && m === 'task' ? ' · ' + times.join(' / ') : '') + '</b>' +
        '<span>登录过期时不会卡住，只在工作台里标注「需要登录」</span></span></label>' +
    '</div>' +
    '<div class="f-row" style="margin-top:12px">' +
      '<div class="field" style="margin:0"><label>执行时间（24 小时制，逗号分隔）</label>' +
        '<input class="inp" id="stSyncTimes" value="' + esc(times.join(',')) + '" placeholder="08:00,20:00" ' +
          (API.connected ? '' : 'disabled') + '></div>' +
      '<div class="field" style="margin:0"><label>&nbsp;</label>' +
        '<button class="btn" id="stSaveTimes" style="width:100%" ' + (API.connected ? '' : 'disabled') + '>' +
        ic('check') + '保存并应用到系统</button></div>' +
    '</div>' +
    '<div class="hint" style="margin-top:8px">' + lastRunTxt +
      (nextTxt ? '<br>下次自动同步：<b>' + nextTxt + '</b>' : '') +
      (SCHED.note ? '<br>' + esc(SCHED.note) : '') + '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">' +
      '<button class="btn btn-xs" id="stSchedRefresh"' + (API.connected ? '' : ' disabled') + '>刷新状态</button>' +
      '<button class="btn btn-xs" id="stSchedGuide">怎么改时间 / 关掉？</button>' +
    '</div>';
}

function bindSchedBox() {
  const sw = $('#stAutoSync');
  if (sw) sw.onclick = () => toggleAutoSync(!SCHED.enabled);
  const saveBtn = $('#stSaveTimes');
  if (saveBtn) saveBtn.onclick = () => {
    const raw = ($('#stSyncTimes').value || '').trim();
    const times = raw.split(/[,，;；\s]+/).filter(Boolean);
    if (!times.length || times.some(t => !/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(t))) {
      toast('时间格式应为 08:00,20:00', 'warn');
      return;
    }
    if (!SCHED.enabled) {
      S.settings.syncTimes = times.join(',');
      save(); toast('已记住时间；把上面的开关打开后生效', 'ok');
      refreshSchedBoxOnly('已记住时间：' + times.join(' / ') + '。打开开关后生效。');
      return;
    }
    applyAutoSync(true, times);
  };
  const rf = $('#stSchedRefresh');
  if (rf) rf.onclick = () => refreshScheduleBox(true);
  const gd = $('#stSchedGuide');
  if (gd) gd.onclick = showScheduleGuide;
}

/* 不传参数 = 保持当前提示语；传字符串（含空串）= 覆盖它。
   早先写成 if (note) 会让「正在读取…」永远清不掉。 */
function refreshSchedBoxOnly(note) {
  if (typeof note === 'string') SCHED.note = note;
  const box = $('#schedBox');
  if (!box) return;
  box.innerHTML = schedBoxHTML();
  bindSchedBox();
}

function applyScheduleStatus(d) {
  SCHED.mode = d && d.mode ? d.mode : 'none';
  SCHED.enabled = !!(d && d.enabled);
  SCHED.times = (d && Array.isArray(d.times)) ? d.times : [];
  SCHED.lastRun = (d && d.lastRun) || null;
  SCHED.loaded = true;
}

async function refreshScheduleBox(force) {
  if (!API.connected) {
    SCHED.mode = 'none'; SCHED.enabled = false; SCHED.loaded = true;
    refreshSchedBoxOnly();
    return;
  }
  if (SCHED.loaded && !force) { refreshSchedBoxOnly(); return; }
  refreshSchedBoxOnly('正在读取系统里的定时任务…');
  try {
    applyScheduleStatus(await apiRequest('/api/schedule'));
    SCHED.note = '';
  } catch (e) {
    SCHED.mode = 'unknown'; SCHED.loaded = true;
    SCHED.note = '读取系统状态失败，点「刷新状态」再试一次。';
  }
  refreshSchedBoxOnly();
}

async function toggleAutoSync(on) {
  if (!API.connected) { toast('请先通过「启动工作台.bat」打开完整模式', 'warn'); return; }
  const raw = ($('#stSyncTimes') && $('#stSyncTimes').value || '').trim();
  let times = raw.split(/[,，;；\s]+/).filter(Boolean);
  if (!times.length || times.some(t => !/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(t))) {
    times = String(S.settings.syncTimes || '08:00,20:00').split(/[,，;；\s]+/).filter(Boolean);
  }
  await applyAutoSync(on, times);
}

async function applyAutoSync(enabled, times) {
  if (SCHED.busy) return;
  SCHED.busy = true;
  refreshSchedBoxOnly((enabled ? '正在开启' : '正在关闭') + '系统定时任务…');
  let ok = false, note = '';
  try {
    const d = await apiRequest('/api/schedule', {
      method: 'POST',
      body: JSON.stringify({ enabled: enabled, times: times })
    });
    if (d.status) applyScheduleStatus(d.status);
    ok = !!d.ok;
    if (ok) {
      S.settings.autoSync = !!enabled;
      if (enabled) S.settings.syncTimes = times.join(',');
      save();
      note = enabled
        ? '已交给 Windows 计划任务：每天 ' + times.join(' / ') + ' 自动同步。'
        : '已关闭自动同步，仍然可以随时点「立即同步」。';
    } else {
      note = '操作失败：' + (d.error || '未知错误');
    }
  } catch (e) {
    note = '操作失败：' + (e.message || e);
  }
  SCHED.busy = false;
  SCHED.note = note;
  renderSet();
  toast(note, ok ? 'ok' : 'warn');
}

/* ==================== 全局搜索 ==================== */
function globalSearch() {
  const body =
    '<div class="field"><input class="inp" id="gsQ" placeholder="搜索课程、待办、消息…" autocomplete="off"></div>' +
    '<div id="gsR"></div>';
  openModal('全局搜索', body, '', { wide: true });
  const m = modalStack[modalStack.length - 1];
  $('[data-close]', m).onclick = closeModal;
  const input = $('#gsQ', m);
  const out = $('#gsR', m);

  const run = () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { out.innerHTML = '<div class="hint">输入关键词试试，例如「作业」「高数」「四级」。</div>'; return; }
    const hit = t => String(t == null ? '' : t).toLowerCase().indexOf(q) >= 0;
    const courses = S.courses.filter(c => hit(c.name) || hit(c.teacher));
    const todos = S.todos.filter(t => hit(t.title) || hit(t.note) || hit(t.course));
    const msgs = S.messages.filter(x => hit(x.title) || hit(x.content) || hit(x.course));
    let html = '';
    if (courses.length) {
      html += '<div class="sec-title" style="margin-top:6px">课程 · ' + courses.length + '</div>' +
        courses.slice(0, 6).map(c => '<div class="row" data-r-go="courses"><div class="row-main"><div class="row-title">' +
          '<i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:' + c.color + '"></i> ' +
          esc(c.name) + '</div><div class="row-meta"><span>' + esc(c.teacher || '') + '</span></div></div></div>').join('');
    }
    if (todos.length) {
      html += '<div class="sec-title">待办 · ' + todos.length + '</div>' +
        todos.slice(0, 8).map(t => '<div class="row" data-r-go="todo"><div class="row-main"><div class="row-title">' +
          esc(t.title) + '</div><div class="row-meta"><span class="due ' + dueClass(t.due) + '">' + fmtDue(t.due) + '</span>' +
          (t.course ? '<span>' + esc(t.course) + '</span>' : '') + '</div></div></div>').join('');
    }
    if (msgs.length) {
      html += '<div class="sec-title">消息 · ' + msgs.length + '</div>' +
        msgs.slice(0, 8).map(x => '<div class="row" data-r-go="inbox"><div class="row-main"><div class="row-title">' +
          esc(x.title) + '</div><div class="row-meta"><span>' + esc((PLAT[x.platform] || {}).name || '') + '</span>' +
          '<span>' + relTime(x.time) + '</span></div></div></div>').join('');
    }
    if (!html) html = emptyHTML('search', '没有找到与「' + q + '」相关的内容');
    out.innerHTML = html;
    $$('[data-r-go]', out).forEach(el => el.onclick = () => {
      UI.view = el.dataset.rGo;
      closeModal();
      render();
      window.scrollTo(0, 0);
    });
  };
  input.oninput = run;
  run();
}

/* ==================== 提醒 ==================== */
async function askNotify() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  try {
    const p = await Notification.requestPermission();
    return p === 'granted';
  } catch (e) { return false; }
}
function pushNotice(title, body) {
  if (S.settings.notify && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification(title, { body: body, tag: title + body }); } catch (e) { }
  }
  toast(title + '：' + body, 'warn');
}
function testNotify() {
  const now = new Date();
  const w = weekOf(now), wd = weekdayOf(now);
  const t = sessionsOn(w, wd)[0];
  const body = t ? ('下一节：' + t.c.name + ' ' + secTime(t.s.start).start) : ('今天有 ' + openTodos().length + ' 项待办未完成');
  if (S.settings.notify && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification('学伴 · 提醒测试', { body: body }); } catch (e) { }
    toast('已发送桌面提醒（如果没看到，请检查系统通知权限）', 'ok');
  } else {
    toast('这是一条演示提醒 · ' + body, 'warn');
    if (!S.settings.demo && !('Notification' in window && Notification.permission === 'granted')) {
      toast('想收到桌面弹窗？去 设置 → 打开「桌面提醒」', 'warn');
    }
  }
}

let notifyTimer = null;
function startReminders() {
  if (notifyTimer) clearInterval(notifyTimer);
  notifyTimer = setInterval(checkReminders, 60000);
  setTimeout(checkReminders, 4000);
}
function notifiedAlready(key) {
  if (S.meta.notified.indexOf(key) >= 0) return true;
  S.meta.notified.push(key);
  if (S.meta.notified.length > 300) S.meta.notified = S.meta.notified.slice(-200);
  save();
  return false;
}
function checkReminders() {
  const now = new Date();
  const before = (+S.settings.remindBeforeMin || 30) * 60000;

  // 待办到期提醒
  S.todos.filter(t => !t.done && t.due).forEach(t => {
    const d = parseD(t.due);
    if (!d) return;
    const diff = d - now;
    if (diff > 0 && diff <= before) {
      const key = 'todo-' + t.id + '-' + ymd(now);
      if (!notifiedAlready(key)) pushNotice('待办即将到期', t.title + '（' + Math.round(diff / 60000) + ' 分钟后）');
    } else if (diff <= 0 && diff > -60000) {
      const key = 'todo-over-' + t.id + '-' + ymd(now);
      if (!notifiedAlready(key)) pushNotice('待办已到期', t.title);
    }
  });

  // 上课提醒（提前 20 分钟）
  const w = weekOf(now), wd = weekdayOf(now);
  sessionsOn(w, wd).forEach(x => {
    const t = secTime(x.s.start);
    const hm = t.start.split(':').map(Number);
    const st = new Date(now); st.setHours(hm[0], hm[1], 0, 0);
    const diff = st - now;
    if (diff > 0 && diff <= 20 * 60000) {
      const key = 'class-' + x.c.id + '-' + x.s.start + '-' + ymd(now);
      if (!notifiedAlready(key)) pushNotice('快上课了', x.c.name + ' ' + t.start + (x.s.room ? ' · ' + x.s.room : ''));
    }
  });
}

/* ==================== 渲染调度 ==================== */
function render() {

  renderMobileNav();
  renderTopbar();
  const v = UI.view;
  if (v === 'dash') renderDash();
  else if (v === 'tt') renderTT();
  else if (v === 'todo') renderTodos();
  else if (v === 'inbox') renderInbox();
  else if (v === 'courses') renderCourses();
  else if (v === 'cet') renderCET();
  else if (v === 'plat') renderPlat();
