/* ==================== 启动 ==================== */
function readSyncPayload() {
  const el = document.getElementById('sync-payload');
  if (!el) return null;
  try {
    const txt = (el.textContent || '').trim();
    if (!txt) return null;
    const obj = JSON.parse(txt);
    if (!obj || typeof obj !== 'object') return null;
    if (!(obj.messages || []).length && !(obj.todos || []).length && !(obj.courses || []).length) return null;
    return obj;
  } catch (e) {
    console.warn('同步数据解析失败', e);
    return null;
  }
}

/* ==================== 后台同步的增量感知 ====================
   自动同步是后台跑的：页面开着不动的时候，数据库可能已经被写进了新通知。
   页面手里还是旧快照，所以回到页面时对一下版本号，变了就把数据读进来并重渲染，
   免得你一直看着几小时前的数据还以为没同步。

   只在**没有待保存改动**时做（saveTimer 是防抖保存的计时器）。
   纯属锦上添花，请求失败就静默放过，不能影响正常使用。 */
async function refreshIfStale() {
  if (!API.enabled || !API.connected || API.saving || saveTimer) return;
  try {
    const data = await apiRequest('/api/state');
    if (!data || !data.revision || data.revision === API.revision) return;
    const m0 = S.messages.length, t0 = S.todos.length;
    if (!applyState(data.state || {})) return;
    API.revision = data.revision;
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { }
    render();
    const dm = S.messages.length - m0, dt = S.todos.length - t0;
    if (dm > 0 || dt > 0) {
      const parts = [];
      if (dm > 0) parts.push('新增 ' + dm + ' 条消息');
      if (dt > 0) parts.push('新增 ' + dt + ' 项待办');
      toast('后台同步带来了：' + parts.join(' · '), 'ok');
    }
  } catch (e) { /* 静默 */ }
}

async function boot() {
  let had = load();

  // 通过本地服务打开时，SQLite 是主数据源；服务不可用时自动退回浏览器缓存。
  const serverState = await loadServerState();
  if (serverState) {
    applyState(serverState);
    had = true;
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { }
  }

  // 先看同步脚本有没有注入数据
  const payload = readSyncPayload();
  const hasPayload = !!payload && (
    (payload.messages || []).length || (payload.todos || []).length || (payload.courses || []).length);

  // 问一次后端：这是不是「第一次用」（判据是 onboarded.json 在不在）。
  // 发布包发出去时对方一定是第一次 —— 这时就不塞示例数据了，
  // 因为他要看的是自己抓回来的东西，不是一张假课表。
  const onboard = (typeof onboardProbe === 'function') ? await onboardProbe() : null;
  const needOnboard = !!(onboard && onboard.needsOnboarding);

  // 首次使用、而且还没有同步过任何真实数据 → 填一份示例数据方便先看懂界面
  if (!had && !hasPayload && !needOnboard) {
    seedDemo();
    save();
  }

  // 再合并同步数据（一定要放在示例数据之后，否则会被示例数据覆盖掉）
  if (hasPayload) {
    const n = mergePayload(payload, true);
    if (n.msgs || n.todos || n.courses) {
      save();
      setTimeout(() => toast('同步完成：新增 ' + n.msgs + ' 条消息 · ' + n.todos + ' 项待办', 'ok'), 700);
    }
  }

  // 数据库首次启动时，把当前浏览器数据写入 SQLite。
  if (API.connected && !serverState) await pushServerState(false);

  render();
  startReminders();

  // 悬浮操作按钮
  const fabTodo = $('#fabTodo'), fabCourse = $('#fabCourse');
  if (fabTodo) fabTodo.onclick = () => editTodo(null);
  if (fabCourse) fabCourse.onclick = () => editCourse(null);

  // 快捷键
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.key === '/' ) { e.preventDefault(); globalSearch(); }
    else if (e.key.toLowerCase() === 'n' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); editTodo(null); }
    else if (e.key.toLowerCase() === 't' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); editCourse(null); }
    else if (e.key >= '1' && e.key <= '8' && !e.metaKey && !e.ctrlKey) {
      const order = ['dash', 'tt', 'todo', 'inbox', 'courses', 'cet', 'plat', 'set'];
      const k = order[+e.key - 1];
      if (k) { UI.view = k; render(); window.scrollTo(0, 0); }
    }
  });

  // 跨天自动刷新
  let lastDay = ymd(new Date());
  setInterval(() => {
    const d = ymd(new Date());
    if (d !== lastDay) { lastDay = d; render(); }
  }, 30000);

  // 页面重新可见时：刷新相对时间，并看看后台是不是已经同步过新数据了
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    render();
    refreshIfStale();
  });

  // 引导放在最后弹：先把界面渲染好，向导盖在上面，关掉就能直接用。
  // 不能放在最前面 —— 向导要盖在一个已经画好的界面上才不显得像白屏。
  if (needOnboard && typeof onboardMaybeStart === 'function') onboardMaybeStart(onboard);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

/* ⚠️ 这里刻意不写 })();
   整个前端从 01-core.js 起就是一个大 IIFE，闭合符必须待在**最后加载**的模块里。
   07-onboard.js 排在后面，由它收尾。加新模块时别把顺序搞乱，
   否则新代码会掉到闭包外面 —— 表现为 API is not defined。 */

/* ---------- 06a-timetable-import.js ---------- */
/* 图片只发送给本机 API；识别为草稿，确认前不写入课程或设置。 */
const TT_DRAFT = { rows: [], image: '', warnings: [], rawText: '', busy: false, error: '' };

function termMonday(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value || '')) return '';
  const d = parseD(value + 'T00:00:00');
  if (!d || ymd(d) !== value) return '';
  d.setDate(d.getDate() - (weekdayOf(d) - 1));
  return ymd(d);
}

function simpleWeeks(weeks) {
  const m = String(weeks || '').match(/^(\d+)(?:-(\d+))?([单双])?$/);
  return m ? { from: +m[1], to: +(m[2] || m[1]), parity: m[3] || '' }
    : { from: 1, to: Math.max(1, S.settings.totalWeeks - 2), parity: 'custom' };
}

function weekRuleHTML(weeks) {
  const p = simpleWeeks(weeks);
  return '<div class="week-rule">' +
    '<label>从第 <input class="inp s-from" aria-label="上课起始周" type="number" min="1" max="40" value="' + p.from + '"> 周</label>' +
    '<label>到第 <input class="inp s-to" aria-label="上课结束周" type="number" min="1" max="40" value="' + p.to + '"> 周</label>' +
    '<select class="inp s-parity" aria-label="单双周">' +
      [['', '每周'], ['单', '仅单周'], ['双', '仅双周'], ['custom', '自定义周次']].map(x =>
        '<option value="' + x[0] + '"' + (p.parity === x[0] ? ' selected' : '') + '>' + x[1] + '</option>').join('') +
    '</select><label class="week-advanced">周次 <input class="inp s-weeks" aria-label="自定义周次" value="' + esc(weeks || '1-18') + '" placeholder="1-8,10-16"></label></div>';
}

function bindWeekRules(root) {
  $$('.week-rule', root).forEach(row => {
    const update = () => {
      if ($('.s-parity', row).value !== 'custom') {
        $('.s-weeks', row).value = $('.s-from', row).value + '-' + $('.s-to', row).value + $('.s-parity', row).value;
      }
    };
    ['.s-from', '.s-to', '.s-parity'].forEach(sel => $(sel, row).onchange = update);
    $('.s-weeks', row).onchange = () => {
      const p = simpleWeeks($('.s-weeks', row).value.trim());
      $('.s-from', row).value = p.from; $('.s-to', row).value = p.to; $('.s-parity', row).value = p.parity;
    };
  });
}

function weeksFromRule(root) {
  const parity = $('.s-parity', root).value;
  return parity === 'custom' ? $('.s-weeks', root).value.trim()
    : $('.s-from', root).value + '-' + $('.s-to', root).value + parity;
}

function validSessionWeeks(spec, total) {
  if (!/^\d+(?:-\d+)?(?:[,，]\d+(?:-\d+)?)*[单双]?$/.test(spec)) return false;
  const numbers = spec.match(/\d+/g).map(Number);
  if (numbers.some(n => n < 1 || n > total)) return false;
  if (spec.split(/[,，]/).some(part => { const n = part.match(/\d+/g).map(Number); return n.length === 2 && n[0] > n[1]; })) return false;
  const weeks = parseWeeks(spec);
  return !!(weeks && weeks.size);
}

function timetableImportHTML(prefix) {
  return '<div class="tt-import" id="' + prefix + '">' +
    '<div class="f-row"><div class="field"><label for="' + prefix + '-date">开学日期</label>' +
      '<input class="inp ti-date" id="' + prefix + '-date" type="date" value="' + esc(S.settings.termStart) + '">' +
      '<div class="hint">按开学所在周的周一作为第 1 周起点。</div></div>' +
    '<div class="field"><label for="' + prefix + '-weeks">学期总周数</label>' +
      '<input class="inp ti-total" id="' + prefix + '-weeks" type="number" min="1" max="40" value="' + S.settings.totalWeeks + '"></div></div>' +
    '<div class="ti-upload"><label class="btn" for="' + prefix + '-file">' + ic('upload') + '上传课表图片</label>' +
      '<input class="ti-file" id="' + prefix + '-file" type="file" accept="image/png,image/jpeg,image/webp">' +
      '<p class="hint">上传包含星期列和节次栏的清晰整周课表。使用 Windows 本机 OCR，不上传到云端；识别后请核对。</p></div>' +
    '<div class="ti-status" role="status"></div><div class="ti-preview"></div>' +
    '<div class="ti-toolbar"><b>课程草稿</b><button class="btn btn-xs ti-add" type="button">' + ic('plus') + '手动补一门</button></div>' +
    '<div class="ti-rows"></div><details class="ti-raw" hidden><summary>查看识别原文</summary><pre></pre></details>' +
    '<div class="hint mt">确认后追加到课表，不删除已有课程。可以修改课程名称、节次、起止周和单双周。</div></div>';
}

function timetableDraftRow(row, i) {
  return '<div class="ti-course" data-index="' + i + '">' +
    '<div class="f-row"><div class="field"><label>课程名称</label><input class="inp ti-name" aria-label="课程名称" value="' + esc(row.name) + '"></div>' +
    '<div class="field"><label>授课老师</label><input class="inp ti-teacher" aria-label="授课老师" value="' + esc(row.teacher || '') + '"></div>' +
    '<button class="icon-btn ti-remove" type="button" title="移除草稿">' + ic('trash') + '</button></div>' +
    '<div class="ti-session"><label>星期<select class="inp ti-day" aria-label="星期">' + WD.map((w, k) => '<option value="' + (k+1) + '"' + (+row.day === k+1 ? ' selected' : '') + '>周' + w + '</option>').join('') + '</select></label>' +
    '<label>开始节次<input class="inp ti-start" aria-label="开始节次" type="number" min="1" max="' + sections().length + '" value="' + row.start + '"></label>' +
    '<label>连上几节<input class="inp ti-len" aria-label="连上几节" type="number" min="1" max="' + sections().length + '" value="' + row.len + '"></label>' +
    '<label>教室<input class="inp ti-room" aria-label="教室" value="' + esc(row.room || '') + '"></label></div>' +
    weekRuleHTML(row.weeks) + '</div>';
}

function collectTimetableDraft(root) {
  TT_DRAFT.rows = $$('.ti-course', root).map(row => {
    const previous = TT_DRAFT.rows[+row.dataset.index] || {};
    return Object.assign({}, previous, { name: $('.ti-name', row).value.trim(), teacher: $('.ti-teacher', row).value.trim(),
      day: +$('.ti-day', row).value, start: +$('.ti-start', row).value, len: +$('.ti-len', row).value,
      room: $('.ti-room', row).value.trim(), weeks: weeksFromRule(row) });
  });
}

function paintTimetableDraft(root) {
  $('.ti-status', root).textContent = TT_DRAFT.busy ? '正在本机识别，请稍候…' :
    (TT_DRAFT.error || TT_DRAFT.warnings.join(' '));
  $('.ti-status', root).classList.toggle('error', !!TT_DRAFT.error);
  $('.ti-preview', root).innerHTML = TT_DRAFT.image ? '<img alt="上传的课表预览" src="' + TT_DRAFT.image + '">' : '';
  $('.ti-rows', root).innerHTML = TT_DRAFT.rows.map(timetableDraftRow).join('') || '<p class="hint">还没有课程草稿。上传图片识别，或手动补录。</p>';
  const raw = $('.ti-raw', root); raw.hidden = !TT_DRAFT.rawText; $('pre', raw).textContent = TT_DRAFT.rawText;
  $('.ti-file', root).disabled = TT_DRAFT.busy; $('.ti-add', root).disabled = TT_DRAFT.busy;
  bindWeekRules(root);
  $$('.ti-remove', root).forEach(button => button.onclick = () => {
    const index = +button.closest('.ti-course').dataset.index;
    collectTimetableDraft(root); TT_DRAFT.rows.splice(index, 1); paintTimetableDraft(root);
  });
}

async function timetableFileData(file) {
  if (!['image/png', 'image/jpeg', 'image/webp'].includes(file.type)) throw new Error('请上传 PNG、JPG 或 WebP 图片。');
  if (file.size > 15*1024*1024) throw new Error('图片过大，请先裁掉无关内容。');
  const image = await createImageBitmap(file);
  try {
    const scale = Math.min(1, 2400 / Math.max(image.width, image.height));
    const canvas = document.createElement('canvas'); canvas.width = Math.round(image.width*scale); canvas.height = Math.round(image.height*scale);
    const ctx = canvas.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
    const data = canvas.toDataURL('image/jpeg', .92);
    if (data.length > 5_590_000) throw new Error('图片过大，请换成较小的课表截图。');
    return data;
  } finally { image.close(); }
}

function bindTimetableImport(root) {
  paintTimetableDraft(root);
  $('.ti-add', root).onclick = () => {
    collectTimetableDraft(root);
    TT_DRAFT.rows.push({ name: '', teacher: '', day: 1, start: 1, len: 2, room: '', weeks: '1-' + Math.max(1, +$('.ti-total', root).value - 2) });
    paintTimetableDraft(root);
  };
  $('.ti-file', root).onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    if (TT_DRAFT.rows.length && !window.confirm('重新识别会替换当前未保存的课程草稿，已有正式课程不受影响。是否继续？')) return;
    TT_DRAFT.busy = true; TT_DRAFT.error = ''; TT_DRAFT.warnings = []; paintTimetableDraft(root);
    try {
      if (!API.connected) throw new Error('图片识别需要本机服务，请双击「启动工作台.bat」。离线版仍可手动补录。');
      const image = await timetableFileData(file); TT_DRAFT.image = image;
      const data = await apiRequest('/api/timetable/recognize', { method: 'POST', body: JSON.stringify({ image: image, totalWeeks: +$('.ti-total', root).value, maxSections: sections().length }) });
      TT_DRAFT.rows = (data.courses || []).flatMap(c => (c.sessions || []).map(s => Object.assign({ name: c.name, teacher: c.teacher, note: c.note }, s)));
      TT_DRAFT.warnings = data.warnings || []; TT_DRAFT.rawText = data.rawText || '';
      if (TT_DRAFT.rows.length) TT_DRAFT.warnings.unshift('识别到 ' + TT_DRAFT.rows.length + ' 个上课时段，请校对后确认。');
    } catch (error) { TT_DRAFT.error = error.message; }
    finally { TT_DRAFT.busy = false; paintTimetableDraft(root); }
  };
}

function commitTimetableDraft(root) {
  if (TT_DRAFT.busy) { toast('请等待识别完成', 'warn'); return false; }
  const monday = termMonday($('.ti-date', root).value), total = +$('.ti-total', root).value;
  if (!monday || !Number.isInteger(total) || total < 1 || total > 40) { toast('请填写有效开学日期和 1–40 周的学期总周数', 'warn'); return false; }
  collectTimetableDraft(root);
  for (const row of TT_DRAFT.rows) {
    if (!row.name || !Number.isInteger(row.start) || !Number.isInteger(row.len) || row.start < 1 || row.len < 1 || row.start+row.len-1 > sections().length || !validSessionWeeks(row.weeks, total)) {
      toast('请检查课程名称、节次、起止周和单双周，不能超出学期范围', 'warn'); return false;
    }
  }
  TT_DRAFT.rows.forEach(row => {
    const id = 'c-img-' + hashStr(row.name + '|' + (row.teacher || ''));
    let course = S.courses.find(c => c.id === id);
    if (!course) { course = normCourse({ id: id, name: row.name, teacher: row.teacher || '', platform: '', color: PALETTE[S.courses.length % PALETTE.length], note: row.note || '', sessions: [] }); S.courses.push(course); }
    const session = { day: row.day, start: row.start, len: row.len, weeks: row.weeks, room: row.room || '' };
    if (!course.sessions.some(s => JSON.stringify(s) === JSON.stringify(session))) course.sessions.push(session);
  });
  S.settings.termStart = monday; S.settings.totalWeeks = total; UI.week = null;
  save(); TT_DRAFT.rows = []; TT_DRAFT.image = ''; TT_DRAFT.warnings = []; TT_DRAFT.rawText = ''; TT_DRAFT.error = '';
  return true;
}

function openTimetableImport() {
  const modal = openModal('导入课表与学期设置', timetableImportHTML('ttImportModal'),
    '<button class="btn" data-close>取消</button><button class="btn btn-primary" id="tiConfirm">确认并保存</button>', { wide: true });
  const root = $('#ttImportModal', modal); bindTimetableImport(root);
  $('[data-close]', modal).onclick = closeModal;
  $('#tiConfirm', modal).onclick = () => { if (commitTimetableDraft(root)) { closeModal(); render(); toast('课表与学期设置已保存', 'ok'); } };
}

/* ---------- 07-onboard.js ---------- */
/* ==================== 首次使用引导 ====================

   为什么要有这一段
   --------------
   发布包发出去之后，对方电脑上什么都没有：没有课表、没有登录态，
   连 Python 都得现装。以前只能靠他自己在文件夹里翻出一串 .bat 双击，
   很容易卡在第一步就放弃了。

   现在改成：页面一打开就是向导 —— 点一下按钮，扫码窗口自己弹出来；
   扫完自动抓一次，课程和通知直接出现在界面上，全程不用离开浏览器。

   触发条件完全由后端说了算（看 sync/state/onboarded.json 在不在），
   所以老用户永远看不到这个向导，单文件模式也不会弹。
*/

const ONBOARD = {
  need: false,
  step: 'welcome',      // welcome | timetable | login | sync | done
  platforms: [],
  running: null,
  logs: [],
  stats: null,
  timer: null,
  busy: false,
  error: ''
};

const OB_COLOR = { chaoxing: '#3F6BA8', yuketang: '#3F8F6A', icourse163: '#6A5A9C' };
const OB_ICON = { chaoxing: 'book', yuketang: 'bell', icourse163: 'target' };

const OB_STATUS_TXT = {
  ok: '已登录', expiring: '快到期', expired: '已过期',
  session: '已连接', unknown: '未登录', error: '读不到'
};

/* ---------- 和后端对话 ---------- */

async function onboardProbe() {
  if (!API.enabled) return null;
  try {
    const d = await apiRequest('/api/onboarding');
    ONBOARD.platforms = d.platforms || [];
    ONBOARD.running = d.running || null;
    ONBOARD.logs = d.logs || [];
    return d;
  } catch (e) {
    return null;      // 服务没起来就静默降级，不要弹一个点了没反应的向导
  }
}

async function onboardPost(action, payload) {
  return apiRequest('/api/onboarding/' + action, {
    method: 'POST',
    body: JSON.stringify(payload || {})
  });
}

/* ---------- 轮询：这是「扫码好了没」的唯一来源 ---------- */

function onboardStartPoll() {
  if (ONBOARD.timer) return;
  ONBOARD.timer = setInterval(onboardPoll, 1500);
}

function onboardStopPoll() {
  if (ONBOARD.timer) {
    clearInterval(ONBOARD.timer);
    ONBOARD.timer = null;
  }
}

async function onboardPoll() {
  if (ONBOARD.busy || !API.enabled) return;
  ONBOARD.busy = true;
  try {
    const d = await apiRequest('/api/onboarding');
    const before = ONBOARD.running;
    ONBOARD.platforms = d.platforms || [];
    ONBOARD.logs = d.logs || [];
    ONBOARD.running = d.running || null;

    if (ONBOARD.step === 'login') onboardPaintPlatforms();
    if (ONBOARD.step === 'sync') onboardPaintLog();

    // 后台任务从「跑着」变成「停了」——这才是完成信号，不能凭日志猜
    if (before && !ONBOARD.running) {
      if (before.stage === 'login') {
        const p = ONBOARD.platforms.find(x => x.key === before.platform);
        if (p && p.loggedIn) toast(p.label + ' 登录成功', 'ok');
        else toast((p ? p.label : '登录') + ' 这次没完成，可以再试一次', 'warn');
      } else if (before.stage === 'sync' && ONBOARD.step === 'sync') {
        await onboardFinishSync();
      }
    }

    // 从登录步骤点了「开始抓取」之后，跟着后端一起切到抓取进度页
    if (ONBOARD.running && ONBOARD.running.stage === 'sync' && ONBOARD.step === 'login') {
      ONBOARD.step = 'sync';
      onboardRender();
    }
  } catch (e) { /* 静默：轮询失败不该打扰用户 */ }
  finally { ONBOARD.busy = false; }
}

/* ---------- 各步骤的渲染 ---------- */

function onboardShell(stepIndex, bodyHTML, footHTML) {
  const steps = ['欢迎', '课表', '登录', '抓取', '完成'];
  const bar = steps.map((t, i) => {
    const cls = i < stepIndex ? 'done' : (i === stepIndex ? 'now' : '');
    return '<span class="ob-step ' + cls + '"><i>' + (i < stepIndex ? '✓' : (i + 1)) + '</i>' + t + '</span>';
  }).join('<u></u>');

  return '' +
    '<div class="ob-mask" id="obMask">' +
      '<div class="ob-card">' +
        '<div class="ob-head">' +
          '<div class="ob-title">' +
            '<b>学伴</b><span>首次设置向导</span>' +
          '</div>' +
          '<div class="ob-bar">' + bar + '</div>' +
        '</div>' +
        '<div class="ob-body">' + bodyHTML + '</div>' +
        '<div class="ob-foot">' + footHTML + '</div>' +
      '</div>' +
    '</div>';
}

function onboardBodyWelcome() {
  return '' +
    '<h2>欢迎使用学伴</h2>' +
    '<p class="ob-lead">把课表、待办、学习平台的通知和作业收在同一个地方。</p>' +
    '<div class="ob-points">' +
      '<div class="ob-point">' + ic('check') + '<div><b>默认数据保存在本机</b>' +
        '<span>平台同步需要联网；可选小程序云端功能需另行配置。</span></div></div>' +
      '<div class="ob-point">' + ic('user') + '<div><b>用你自己的账号登录</b>' +
        '<span>下面会拉起浏览器窗口，扫码登录一下就行，不会保存你的密码。</span></div></div>' +
      '<div class="ob-point">' + ic('refresh') + '<div><b>按需开启同步与提醒</b>' +
        '<span>完成向导后可在设置中开启定时同步；提醒需要单独配置。</span></div></div>' +
    '</div>' +
    '<p class="ob-hint">整个过程大约 2 分钟。中途想退出也没关系，之后在「设置」里可以重新打开这个向导。</p>';
}

function onboardFootWelcome() {
  return '<button class="btn btn-primary" data-act="toTimetable">开始设置 →</button>';
}

function onboardBodyTimetable() {
  return '<h2>先把你的课表放进来</h2><p class="ob-lead">设置开学日期，上传课表图片。本机识别后，可修改课程的单双周和上课周数。</p>' + timetableImportHTML('obTimetable');
}

function onboardFootTimetable() {
  return '<button class="btn btn-ghost" data-act="skipTimetable">以后再录入</button><button class="btn btn-primary" data-act="saveTimetable">确认课表，下一步 →</button>';
}

function onboardBodyLogin() {
  return '' +
    '<h2>登录你的学习平台</h2>' +
    '<p class="ob-lead">登录哪个就抓哪个。暂时用不上的，直接跳过，以后随时能补。</p>' +
    '<div class="ob-plats" id="obPlats"></div>' +
    '<div class="ob-logbox" id="obLogbox" hidden>' +
      '<div class="ob-logtitle">登录窗口里的进度</div>' +
      '<pre class="ob-log" id="obLog"></pre>' +
    '</div>' +
    '<p class="ob-hint">点「扫码登录」后会弹出一个浏览器窗口，用手机扫码即可。' +
    '登录完窗口会自己关掉，回到这一页继续。</p>';
}

function onboardFootLogin() {
  return '<button class="btn btn-ghost" data-act="skipLogin">都先跳过</button>' +
         '<button class="btn btn-primary" data-act="toSync">登录好了，开始抓数据 →</button>';
}

function onboardPaintPlatforms() {
  const box = $('#obPlats');
  if (!box) return;
  const runningKey = ONBOARD.running && ONBOARD.running.stage === 'login'
    ? ONBOARD.running.platform : '';
  box.innerHTML = ONBOARD.platforms.map(p => {
    const busy = runningKey === p.key;
    const badge = busy ? '登录中…' : (OB_STATUS_TXT[p.status] || p.status);
    const cls = busy ? 'busy' : (p.loggedIn ? 'ok' : 'idle');
    const extra = p.loggedIn && p.daysLeft !== null && p.daysLeft !== undefined
      ? '（还剩 ' + p.daysLeft + ' 天）' : '';
    return '' +
      '<div class="ob-plat ' + cls + '" style="--pc:' + (OB_COLOR[p.key] || '#171717') + '">' +
        '<div class="ob-plat-ic">' + ic(OB_ICON[p.key] || 'link') + '</div>' +
        '<div class="ob-plat-main">' +
          '<b>' + esc(p.label) + '</b>' +
          '<span>' + esc(p.use || '') + '</span>' +
        '</div>' +
        '<div class="ob-plat-side">' +
          '<span class="ob-badge ' + cls + '">' + esc(badge + ' ' + extra) + '</span>' +
          '<button class="btn btn-sm" data-login="' + p.key + '"' + (busy ? ' disabled' : '') + '>' +
            (p.loggedIn ? '重新登录' : '扫码登录') + '</button>' +
        '</div>' +
      '</div>';
  }).join('');

  const logbox = $('#obLogbox');
  if (logbox) logbox.hidden = !runningKey;
  if (runningKey) onboardPaintLog();
}

function onboardBodySync() {
  return '' +
    '<div class="ob-syncing" id="obSyncBox">' +
      '<div class="ob-spin"></div>' +
      '<h2>正在抓取你的课程和通知</h2>' +
      '<p class="ob-lead">第一次通常要 20~40 秒。这一步用的是后台浏览器，不会打扰你。</p>' +
      '<div class="ob-progress"><span id="obBar"></span></div>' +
      '<pre class="ob-log" id="obLog"></pre>' +
    '</div>';
}

function onboardFootSync() {
  return '<button class="btn btn-ghost" data-act="toDone" disabled>先看看界面</button>';
}

function onboardPaintLog() {
  const el = $('#obLog');
  if (!el) return;
  const lines = ONBOARD.logs.slice(-9);
  el.textContent = lines.length ? lines.join('\n') : '正在启动…';
  el.scrollTop = el.scrollHeight;
  const bar = $('#obBar');
  if (bar) bar.style.width = Math.min(88, 12 + ONBOARD.logs.length * 6) + '%';
}

function onboardBodyDone() {
  const s = ONBOARD.stats;
  const line = s
    ? ('已经收到 <b>' + s.msgs + '</b> 条消息、<b>' + s.todos + '</b> 项待办、<b>' + s.courses + '</b> 门课程。')
    : '抓取结束。进去看看有没有新东西。';
  return '' +
    '<div class="ob-done">' + ic('check') + '</div>' +
    '<h2>设置完成</h2>' +
    '<p class="ob-lead">' + line + '</p>' +
    '<div class="ob-points">' +
      '<div class="ob-point">' + ic('cal') + '<div><b>顺便把课表补上</b>' +
        '<span>课表可上传图片识别；之后在「我的课表」里点课程修改单双周、上课周数或教室。</span></div></div>' +
      '<div class="ob-point">' + ic('clock') + '<div><b>学期第一周记得改</b>' +
        '<span>单双周、周次都靠「设置」里的学期开始日期推算。</span></div></div>' +
    '</div>';
}

function onboardFootDone() {
  return '<button class="btn btn-primary" data-act="finish">进入工作台 →</button>';
}

function onboardRender() {
  const idx = { welcome: 0, timetable: 1, login: 2, sync: 3, done: 4 }[ONBOARD.step] || 0;
  let body = '', foot = '';
  if (ONBOARD.step === 'welcome') { body = onboardBodyWelcome(); foot = onboardFootWelcome(); }
  else if (ONBOARD.step === 'timetable') { body = onboardBodyTimetable(); foot = onboardFootTimetable(); }
  else if (ONBOARD.step === 'login') { body = onboardBodyLogin(); foot = onboardFootLogin(); }
  else if (ONBOARD.step === 'sync') { body = onboardBodySync(); foot = onboardFootSync(); }
  else { body = onboardBodyDone(); foot = onboardFootDone(); }

  const old = $('#obMask');
  if (old) old.remove();
  document.body.insertAdjacentHTML('beforeend', onboardShell(idx, body, foot));
  if (ONBOARD.step === 'timetable') {
    $('#obMask .ob-card').classList.add('ob-wide'); bindTimetableImport($('#obTimetable'));
  }

  if (ONBOARD.step === 'login') onboardPaintPlatforms();
  if (ONBOARD.step === 'sync') onboardPaintLog();
  onboardBind();
}

/* ---------- 交互 ---------- */

function onboardBind() {
  const mask = $('#obMask');
  if (!mask) return;
  mask.addEventListener('click', async (e) => {
    const loginBtn = e.target.closest('[data-login]');
    if (loginBtn) { await onboardLogin(loginBtn.getAttribute('data-login')); return; }
    const act = e.target.closest('[data-act]');
    if (!act) return;
    const a = act.getAttribute('data-act');
    if (a === 'toTimetable') { ONBOARD.step = 'timetable'; onboardRender(); }
    else if (a === 'skipTimetable') {
      if (TT_DRAFT.busy) { toast('请等待图片识别完成', 'warn'); return; }
      if (TT_DRAFT.rows.length && !window.confirm('当前课表草稿尚未保存，确定先跳过吗？')) return;
      ONBOARD.step = 'login'; onboardRender(); onboardStartPoll();
    }
    else if (a === 'saveTimetable') {
      if (!commitTimetableDraft($('#obTimetable'))) return;
      ONBOARD.step = 'login'; onboardRender(); onboardStartPoll();
    }
    else if (a === 'skipLogin') { ONBOARD.step = 'sync'; onboardRender(); onboardStartPoll(); await onboardSync(); }
    else if (a === 'toSync') { ONBOARD.step = 'sync'; onboardRender(); onboardStartPoll(); await onboardSync(); }
    else if (a === 'toDone') { ONBOARD.step = 'done'; onboardRender(); }
    else if (a === 'finish') { await onboardFinish(); }
  });
}

async function onboardLogin(key) {
  try {
    const r = await onboardPost('login', { platform: key });
    if (!r.ok) { toast(r.message || '启动失败', 'warn'); return; }
    toast('已打开登录窗口，请用手机扫码', 'ok');
    onboardStartPoll();
  } catch (e) {
    toast('启动登录失败：' + e.message, 'err');
  }
}

async function onboardSync() {
  try {
    const r = await onboardPost('sync', {});
    if (!r.ok) {
      // 环境没装好 / 上一步还在跑 —— 直接把话说清楚，别让用户干等
      ONBOARD.step = 'login';
      onboardRender();
      toast(r.message || '抓取没能启动', 'warn');
      return;
    }
    onboardStartPoll();
  } catch (e) {
    toast('启动抓取失败：' + e.message, 'err');
  }
}

async function onboardFinishSync() {
  ONBOARD.step = 'done';
  ONBOARD.stats = null;
  onboardRender();
  try {
    const d = await apiRequest('/api/state');
    const st = d.state || {};
    ONBOARD.stats = {
      msgs: (st.messages || []).length,
      todos: (st.todos || []).length,
      courses: (st.courses || []).length
    };
    onboardRender();
  } catch (e) { /* 数字拿不到就退化成一句笼统的话 */ }
}

async function onboardFinish() {
  try { await onboardPost('done', {}); } catch (e) { /* 标记失败也不该卡住用户 */ }
  onboardStopPoll();
  const mask = $('#obMask');
  if (mask) mask.remove();
  location.reload();      // 重新走一遍 boot，把抓到的数据读进来
}

/* ---------- 入口 ---------- */

function onboardMaybeStart(d) {
  if (!d || !d.needsOnboarding) return;
  ONBOARD.need = true;
  ONBOARD.step = 'welcome';
  ONBOARD.platforms = d.platforms || [];
  ONBOARD.running = d.running || null;
  ONBOARD.logs = d.logs || [];
  onboardRender();
}

/** 给「设置」页用：想再走一遍向导的时候调它。 */
async function onboardRestart() {
  const d = await onboardProbe();
  if (!d) { toast('后端服务没连上，无法打开向导', 'warn'); return; }
  ONBOARD.step = 'welcome';
  onboardMaybeStart(Object.assign({}, d, { needsOnboarding: true }));
}

})();

   （最后加载的模块）。新增模块请排在 06 之后、以本文件为结尾，
   否则代码会掉到闭包外，报 API is not defined。 */

</script>
